// ---------- scheduling ----------
function eventsWeek() {
  if (S.week - S.lastEventWeek < 7 || S.week < 10) return;
  if (!rng.chance(0.17)) return;
  const pool = [];
  const seen = S.evSeen || (S.evSeen = {});
  const count = S.evCount || (S.evCount = {});
  for (const id in EVENTS) {
    const ev = EVENTS[id];
    if (!ev.w) continue;
    if (seen[id] != null && S.week - seen[id] < (ev.cd || 120)) continue;
    if (id === S.lastEventId) continue;
    const data = ev.cond();
    if (data) pool.push({ id, data, w: ev.w / (1 + (count[id] || 0) * 0.6) });
  }
  if (!pool.length) return;
  const pick = rng.weighted(pool, (x) => x.w);
  S.lastEventWeek = S.week;
  S.lastEventId = pick.id;
  seen[pick.id] = S.week;
  count[pick.id] = (count[pick.id] || 0) + 1;
  const m = EVENTS[pick.id].make(pick.data);
  // make() can mutate state (flags), so store its resolved text now
  notify({ kind: 'event', cat: EVENTS[pick.id].cat, title: m.title, text: m.text, ev: pick.id, data: pick.data, pause: true });
}
function laterWeek() {
  if (!S.later || !S.later.length) return;
  const due = S.later.filter((x) => x.week <= S.week);
  S.later = S.later.filter((x) => x.week > S.week);
  for (const x of due) {
    if (LATER[x.ev]) { const o = LATER[x.ev](x.data || {}); if (o) consequence(o); continue; }
    const E = EVENTS[x.ev];
    if (!E) continue;
    const m = E.make(x.data);
    notify({ kind: 'event', cat: E.cat, title: m.title, text: m.text, ev: x.ev, data: x.data, pause: true });
  }
}
// Resolve a note choice. For event notes, choices come from EVENTS[ev].make(data).
const NOTE_ACTIONS = {
  noop() {},
  openReport(id) { Bus.emit('ui', { open: 'report', id }); },
  openCandidates(kind) { Bus.emit('ui', { open: 'candidates', kind }); },
  openAwards(n) { Bus.emit('ui', { open: 'awards', note: n }); },
  openPanel(which) { Bus.emit('ui', { open: which }); },
};
function noteChoices(n) {
  if (n.ev && EVENTS[n.ev]) {
    if (n.ev === 'candidates') return [{ label: 'Review them', style: 'primary', ui: 'candidates', args: n.data && n.data.kind }, { label: 'Later', hint: `Find them under ${n.data && n.data.kind === 'scout' ? 'Artists' : 'Staff'}` }];
    return EVENTS[n.ev].make(n.data).choices;
  }
  return n.choices || null;
}
// Returns what happened (for event choices), so the interface can show the outcome.
function resolveNote(id, idx) {
  const i = S.notes.findIndex((n) => n.id === id);
  if (i < 0) return null;
  const n = S.notes[i];
  const choices = noteChoices(n);
  const ch = choices && choices[idx];
  S.notes.splice(i, 1);
  let out = null;
  if (n.kind === 'awards' && n.data && n.data.results) {
    const before = statSnap();
    const show = AWARD_SHOW[n.data.show] || AWARD_SHOW.needle;
    for (const r of n.data.results) awardRewards(show, r);
    out = { text: '', chips: snapChips(before, statSnap()), later: false };
  }
  if (ch) {
    const before = statSnap();
    const laterN = (S.later || []).length;
    let res;
    if (ch.run) res = ch.run(n.data);
    else if (ch.ui === 'candidates') NOTE_ACTIONS.openCandidates(ch.args);
    else if (ch.action && NOTE_ACTIONS[ch.action]) NOTE_ACTIONS[ch.action](ch.args, n);
    if (n.ev && ch.run) {
      const o = typeof res === 'string' ? { text: res } : res && typeof res === 'object' ? res : {};
      out = { text: o.text || '', letters: o.letters || null, chips: snapChips(before, statSnap()), later: (S.later || []).length > laterN };
    }
  }
  Bus.emit('noteResolved', n);
  return out;
}

// ============================================================
// Art: isometric primitives, people, portraits, cover art
// ============================================================
const ISO_RX = 45.25, ISO_RY = 22.63; // screen radii of a 1-tile circle on the floor
function isoP(x, y, z) { return [(x - y) * 32, (x + y) * 16 - (z || 0)]; }

function pathPoly(ctx, pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function fillPoly(ctx, pts, fill) { pathPoly(ctx, pts); ctx.fillStyle = fill; ctx.fill(); }
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
  else {
    const rr = Array.isArray(r) ? r[0] : r;
    ctx.moveTo(x + rr, y); ctx.arcTo(x + w, y, x + w, y + h, rr); ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr); ctx.arcTo(x, y, x + w, y, rr); ctx.closePath();
  }
}
function fillRR(ctx, x, y, w, h, r, col) { rrect(ctx, x, y, w, h, r); ctx.fillStyle = col; ctx.fill(); }
function circle(ctx, x, y, r, col) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = col; ctx.fill(); }
function ellipse(ctx, x, y, rx, ry, col, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); ctx.fillStyle = col; ctx.fill(); }

// A box with three visible faces. x/y in tiles, z/h in pixels.
function isoBox(ctx, x, y, z, w, d, h, col, o) {
  o = o || {};
  const top = o.top || shade(col, 0.16), left = o.left || col, right = o.right || shade(col, -0.18);
  if (h > 0) {
    fillPoly(ctx, [isoP(x, y + d, z), isoP(x + w, y + d, z), isoP(x + w, y + d, z + h), isoP(x, y + d, z + h)], left);
    fillPoly(ctx, [isoP(x + w, y, z), isoP(x + w, y + d, z), isoP(x + w, y + d, z + h), isoP(x + w, y, z + h)], right);
  }
  fillPoly(ctx, [isoP(x, y, z + h), isoP(x + w, y, z + h), isoP(x + w, y + d, z + h), isoP(x, y + d, z + h)], top);
  if (o.line) {
    ctx.strokeStyle = o.line; ctx.lineWidth = 1;
    pathPoly(ctx, [isoP(x, y, z + h), isoP(x + w, y, z + h), isoP(x + w, y + d, z + h), isoP(x, y + d, z + h)]);
    ctx.stroke();
  }
}
function isoQuad(ctx, x, y, z, w, d, col) {
  fillPoly(ctx, [isoP(x, y, z), isoP(x + w, y, z), isoP(x + w, y + d, z), isoP(x, y + d, z)], col);
}
function isoShadow(ctx, x, y, w, d, a) {
  const g = 0.12;
  fillPoly(ctx, [isoP(x - g, y - g), isoP(x + w + g, y - g), isoP(x + w + g, y + d + g), isoP(x - g, y + d + g)], `rgba(43,33,64,${a || 0.08})`);
}
function isoDisc(ctx, cx, cy, z, r, col) {
  const [sx, sy] = isoP(cx, cy, z);
  ellipse(ctx, sx, sy, r * ISO_RX, r * ISO_RY, col);
}
function isoCyl(ctx, cx, cy, z, r, h, col, topCol) {
  const [sx, sy] = isoP(cx, cy, z);
  const rx = r * ISO_RX, ry = r * ISO_RY;
  ctx.beginPath();
  ctx.moveTo(sx - rx, sy - h);
  ctx.lineTo(sx - rx, sy);
  ctx.ellipse(sx, sy, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(sx + rx, sy - h);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  ellipse(ctx, sx, sy - h, rx, ry, topCol || shade(col, 0.18));
}
// Transform so that local (u, v) coordinates draw on a back wall.
// u: px along the wall (32 per tile), v: px down from the top of the wall.
// Right wall = y:0 plane, u grows with x. Left wall = x:0 plane, u grows from front (y=D) to back (y=0).
function wallXf(ctx, side, room) {
  if (side === 'R') ctx.transform(1, 0.5, 0, 1, 0, -room.H);
  else ctx.transform(1, -0.5, 0, 1, -32 * room.D, 16 * room.D - room.H);
}
function wallU(side, room, t) { return side === 'R' ? t * 32 : (room.D - t) * 32; }

// ---------- people ----------
// Draws a front-facing person. (px, py) is the floor point under them
// (standing) or the seat point (sitting). Everything in world px.
const HEAD_S = 0.8; // heads are drawn smaller than the original chibi proportions
function drawPerson(ctx, px, py, look, o) {
  o = o || {};
  const t = o.t || 0, ph = o.phase || 0;
  const pose = o.pose || 'stand';
  ctx.save();
  ctx.translate(px, py);
  if (o.scale && o.scale !== 1) ctx.scale(o.scale, o.scale);
  if (o.flip) ctx.scale(-1, 1);
  const breathe = Math.sin(t * 2.1 + ph) * 0.4;
  const nod = o.nod ? Math.max(0, Math.sin((o.beat || 0) * TAU)) * o.nod : 0;
  const sitting = pose === 'type' || pose === 'sit' || pose === 'lounge' || pose === 'dj';
  const skin = look.skin, shirt = look.shirt, pants = look.pants || '#3A3155';
  const shoe = '#24202E';
  const hipY = sitting ? -2 : -20;
  // legs
  if (!sitting) {
    const sway = pose === 'sing' || pose === 'guitar' ? Math.sin(t * 3 + ph) * 1.0 : 0;
    fillRR(ctx, -6 + sway * 0.3, hipY - 2, 5.4, 22, 2, pants);
    fillRR(ctx, 0.6 + sway * 0.3, hipY - 2, 5.4, 22, 2, shade(pants, -0.1));
    ellipse(ctx, -3.5, 0, 3.8, 1.6, shoe);
    ellipse(ctx, 3.7, 0, 3.8, 1.6, shoe);
  }
  // seated on a couch: thighs run forward along the facing direction, shins drop to the floor
  const fd = o.face === 'y' ? -1 : 1;
  const seatLegs = () => {
    ctx.lineCap = 'round';
    const legs = [[-3.6, shade(pants, -0.06)], [3.6, shade(pants, -0.16)]];
    if (fd < 0) legs.reverse();
    for (const [lx, col] of legs) {
      const kx = lx + fd * 9, ky = hipY + 4.5;
      ctx.strokeStyle = shade(col, -0.05); ctx.lineWidth = 5.2;
      ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(kx + fd * 0.8, 16.5); ctx.stroke();
      ellipse(ctx, kx + fd * 2.4, 17.6, 3.9, 1.7, shoe);
      ctx.strokeStyle = col; ctx.lineWidth = 6.4;
      ctx.beginPath(); ctx.moveTo(lx, hipY - 0.5); ctx.lineTo(kx, ky); ctx.stroke();
    }
  };
  const sway2 = (pose === 'sing' || pose === 'guitar') ? Math.sin(t * 3 + ph) * 1.2 : 0;
  ctx.translate(sway2 * 0.4, 0);
  const torsoTop = hipY - 24 + breathe * 0.4;
  const hy = torsoTop - 8.4 + breathe * 0.5 + nod;
  const head = (fn) => { ctx.save(); ctx.translate(0, hy); ctx.scale(HEAD_S, HEAD_S); ctx.translate(0, -hy); fn(); ctx.restore(); };
  head(() => hairBack(ctx, look, hy));
  // torso
  rrect(ctx, -8.2, torsoTop, 16.4, 24.5, [6, 6, 2.5, 2.5]);
  ctx.fillStyle = shirt; ctx.fill();
  rrect(ctx, 3.6, torsoTop + 2, 4.6, 22.5, [0, 6, 2.5, 0]);
  ctx.fillStyle = 'rgba(20,16,32,0.07)'; ctx.fill();
  // collar
  ctx.fillStyle = shade(shirt, -0.22);
  ctx.beginPath(); ctx.moveTo(-3, torsoTop + 0.4); ctx.lineTo(0, torsoTop + 4); ctx.lineTo(3, torsoTop + 0.4); ctx.closePath(); ctx.fill();
  if (!sitting) { ctx.fillStyle = shade(pants, -0.25); ctx.fillRect(-8.2, torsoTop + 22.5, 16.4, 2); }
  if (pose === 'lounge') {
    fillRR(ctx, -8.2, hipY - 3.5, 16.4, 5, 2.5, shade(pants, -0.1)); // seat of the trousers
    seatLegs();
  }
  // neck
  const neckTop = hy + 5;
  fillRR(ctx, -2.1, neckTop, 4.2, Math.max(2, torsoTop + 1.5 - neckTop), 1.5, shade(skin, -0.12));
  if (!o.noArms) drawArms(ctx, pose, look, torsoTop, hy, t, ph, o);
  head(() => {
    circle(ctx, -9.1, hy + 0.9, 2, shade(skin, -0.08));
    circle(ctx, 9.1, hy + 0.9, 2, shade(skin, -0.08));
    ellipse(ctx, 0, hy + 0.6, 9.2, 10.2, skin);
    if (look.beard) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, hy + 0.6, 9.3, 10.3, 0, 0.05 * Math.PI, 0.95 * Math.PI); ctx.closePath(); ctx.clip();
      ellipse(ctx, 0, hy + 8.5, 9, 6.5, look.hairColor);
      ctx.restore();
    }
    drawFace(ctx, look, hy, t, ph, o);
    hairFront(ctx, look, hy);
    drawHeadwear(ctx, look, hy);
    if (pose === 'sing') { // mic in front of the mouth
      fillRR(ctx, 2.4, hy + 7, 2.4, 9, 1, '#2B2733');
      circle(ctx, 3.6, hy + 5.8, 3, '#5E6475');
      circle(ctx, 2.8, hy + 5, 1, 'rgba(255,255,255,0.4)');
    }
  });
  ctx.restore();
}
function drawArms(ctx, pose, look, torsoTop, hy, t, ph, o) {
  const skin = look.skin, sl = shade(look.shirt, -0.07);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const arm = (pts, w) => {

const _portraitCache = new Map();

const COVER_ACCENTS = ['#FFD23F', '#2B2140', '#FFFFFF', '#14B8C8', '#FF5D5D', '#2FBF71', '#FF9F1C'];

      ctx.restore();

      circle(ctx, x + s * 0.7, y + s * 0.3, s * 0.12, acc);
      fillPoly(ctx, [[x, y + s], [x + s * 0.35, y + s * 0.45], [x + s * 0.7, y + s]], fg);
      fillPoly(ctx, [[x + s * 0.4, y + s], [x + s * 0.72, y + s * 0.55], [x + s * 1.05, y + s]], g === bg ? dark : g);
      break; }

function sceneActors() {

  const p = S.project, k = S.contract;
  const working = !!((p && !p.awaiting) || k);
  const you = S.you;
  if (you.status === 'work') out.push({ type: 'worker', id: 'you', look: you.look, x: L.youSeat.x, y: L.youSeat.y, pose: 'type', working, isYou: true });
  else out.push({ type: 'away', id: 'you', x: L.youSeat.x, y: L.youSeat.y, status: you.status });

    const seat = L.seats[i];
    if (!seat) return;
    if (st.status === 'work') out.push({ type: 'worker', id: st.id, look: st.look, x: seat.x, y: seat.y, pose: 'type', working });

  if (recArtist && p.stage === 1 && !p.awaiting) {

Office.drawFx = function (dt) {
  const ctx = this.ctx;
  for (let i = this.fx.length - 1; i >= 0; i--) {
    const f = this.fx[i];
    f.t += dt;
    if (f.t >= f.life) { this.fx.splice(i, 1); continue; }
    const k = f.t / f.life;
    if (f.kind === 'note') {
      const x = f.x + f.vx * k + Math.sin(f.t * 4) * 4, y = f.y - 46 * k;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(x, y);
      ctx.fillStyle = f.col; ctx.strokeStyle = f.col; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.ellipse(-2, 4, 3, 2.3, -0.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0.6, 3.5); ctx.lineTo(0.6, -5); ctx.lineTo(4.4, -3.6); ctx.stroke();
      ctx.restore();
    } else if (f.kind === 'text') {
      ctx.save(); ctx.globalAlpha = 1 - k * k;
      ctx.font = '900 15px Archivo, "Helvetica Neue", Arial, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = '#FFFFFF'; ctx.strokeText(f.text, f.x, f.y - 30 * k);
      ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y - 30 * k);
      ctx.restore();
    }
  }
};
Office.floatText = function (text, col, who) {
  const src = (who && this.heads[who]) || this.heads.you || [this.cw / 2, this.ch / 2];
  this.fx.push({ kind: 'text', text, col: col || PAL.ink, x: src[0], y: src[1] - 10, t: 0, life: 1.8 });
};
Office.celebrate = function (n) {
  if (this.reduced) return;
  const cols = ['#FF5D5D', '#4C8BF5', '#F5B82E', '#2FBF71', '#9B7BFF', '#FF5FA2', '#14B8C8'];
  for (let i = 0; i < (n || 160); i++) {
    this.confetti.push({ x: Math.random() * this.cw, y: -20 - Math.random() * this.ch * 0.5, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 160, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 10, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, col: cols[i % cols.length], life: 4 + Math.random() * 2, t: 0 });
  }
};
Office.drawConfetti = function (dt) {
  const ctx = this.ctx;
  for (let i = this.confetti.length - 1; i >= 0; i--) {
    const c = this.confetti[i];
    c.t += dt;
    if (c.t > c.life || c.y > this.ch + 20) { this.confetti.splice(i, 1); continue; }
    c.vy += 30 * dt; c.x += c.vx * dt + Math.sin(c.t * 3 + i) * 0.6; c.y += c.vy * dt; c.rot += c.vr * dt;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.globalAlpha = Math.min(1, (c.life - c.t) * 2);
    ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
};
Office.hitTest = function (x, y) {
  for (let i = this.hits.length - 1; i >= 0; i--) {
    const h = this.hits[i];
    if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1) return h;
  }
  return null;
};
// Is a screen point over the room floor (for the click menu)?
Office.onRoom = function (x, y) {
  if (!this.layout) return false;
  const r = this.layout.room;
  const wx = (x - this.ox) / this.scale, wy = (y - this.oy) / this.scale;
  const minX = -32 * r.D, maxX = 32 * r.W;
  return wx >= minX - 10 && wx <= maxX + 10 && wy >= -r.H - 10 && wy <= 16 * (r.W + r.D) + 16;
};

  // ---------- singers ----------
  sing(n, m, t, dur, v, bank) {
    const c = this.ctx, T = VTYPE[n.vt] || VTYPE.sing, f = mtof(m);
    this.setVowel(bank, n.v, t, n.f, T.bright);
    const voice = (type, det, amp) => {
      const o = c.createOscillator(); o.type = type;
      if (T.rap) { o.frequency.setValueAtTime(f * 1.05, t); o.frequency.exponentialRampToValueAtTime(f * 0.87, t + Math.max(0.05, dur)); }
      else if (T.robot) o.frequency.setValueAtTime(f, t);

      if (det) o.detune.setValueAtTime(det, t);

        const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5.3;
        lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * T.vib, t + Math.min(dur, 0.6));

      }
      const g = c.createGain(); this.env(g, t, T.att, amp, 0.3, 0.85, 0.09, dur);
      o.connect(g); g.connect(bank.in); o.start(t); o.stop(t + dur + 0.5);
    };
    voice(T.robot ? 'square' : 'sawtooth', 0, v);
    if (T.dbl) voice('sawtooth', 9, v * 0.55);
    if (T.grit) voice('square', -5, v * 0.3);
    if (T.growl) { voice('sawtooth', 14, v * 0.6); this.noise(t, Math.max(0.08, dur), v * 1.2, 'bandpass', 700, bank.in, 0.6); }
    if (n.c) this.noise(t, T.rap ? 0.03 : 0.04, v * (T.rap ? 0.5 : 0.35), 'highpass', 4800, this.bus.vx);
    if (T.air && dur > 0.3) this.noise(t, Math.min(dur, 0.35), v * T.air * 3, 'bandpass', n.f ? 2800 : 2300, bank.in, 0.7);

  // Backing vocals: harmonies, "ooh" pads, gang shouts.
  singBv(n, tr, t, dur, v) {
    const c = this.ctx, bank = this.bvBank;

    const amp = v / Math.sqrt(n.m.length);
    for (const m0 of n.m) {
      const f = mtof(m0 + tr);
      for (const det of n.pad ? [(m0 % 2) * 12 - 6] : [0]) {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(det, t);
        const g = c.createGain(); this.env(g, t, n.pad ? 0.2 : 0.02, amp, 0.4, 0.85, n.pad ? 0.3 : 0.1, dur);
        o.connect(g); g.connect(bank.in); o.start(t); o.stop(t + dur + (n.pad ? 1.2 : 0.55));
      }
    }
  },
  hey(t, v) { // a gang shout
    const c = this.ctx, bank = this.bvBank;
    this.setVowel(bank, 'e', t, false, 1.3);
    for (const f0 of [190, 230, 260]) {
      const o = c.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f0 * 1.15, t); o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t + 0.18);
      const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.09 * v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

  },
  env(g, t, a, peak, dec, sus, rel, dur) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.setTargetAtTime(peak * sus, t + a, dec);
    g.gain.setTargetAtTime(0.0001, t + Math.max(a, dur), rel);
  },
  osc(type, f, t, dur, peak, opts) {

  applause(dur, big) {

  bubble(kind) {

function salesBars(r) {

    const h = Math.max(1.5, v / mx * (H - 1));
    const x = i * (bw + gap), y = H - h, rad = Math.min(2, bw / 2, h / 2);
    const d = `M${x.toFixed(1)},${H}V${(y + rad).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x + rad).toFixed(1)},${y.toFixed(1)}H${(x + bw - rad).toFixed(1)}Q${(x + bw).toFixed(1)},${y.toFixed(1)} ${(x + bw).toFixed(1)},${(y + rad).toFixed(1)}V${H}Z`;
    return `<path class="${i === data.length - 1 ? 'now' : ''}" d="${d}"><title>Week ${first + i}: ${fmtInt(v)} copies</title></path>`;
  }).join('');

    const m = UI.modal({ cls: 'evcard', closable: false, backdropClose: false, title: null, onClose: () => { if (this.card === m) { this.card = null; setTimeout(() => this.renderNotes(), 0); } } });
    m.kind = 'note';
    m.noteId = n.id;
    this.card = m;
    const col = isResult ? (n.good === false ? '#B23429' : '#2A9A62') : C.col;
    m.el.querySelector('.modal').style.setProperty('--ec', col);
    const head = `<div class="ev-head"><span class="ev-ico">${icon(ic)}</span><span class="ev-kicker">${esc(label)}</span><span class="ev-date">${esc(fmtDate(n.week))}</span></div>`;
    m.body.innerHTML = `${head}<h2 class="ev-title">${esc(n.title)}</h2><p class="ev-text">${esc(n.text || '')}</p>
      ${n.chips && n.chips.length ? `<div class="chips">${chipsHTML(n.chips)}</div>` : ''}
      ${choices && choices.length ? `<div class="ev-choices">${choices.map((c, i) => `<button class="ev-choice ${c.style === 'primary' ? 'pri' : ''}" data-c="${i}"><b>${esc(c.label)}</b>${c.hint ? `<span>${esc(c.hint)}</span>` : ''}</button>`).join('')}</div>` : ''}`;
    m.foot.innerHTML = choices && choices.length ? (n.kind === 'tip' ? `<button class="btn ghost sm" data-x="tipsoff">Turn off tips</button>` : '') : `${n.kind === 'tip' ? '<button class="btn ghost sm" data-x="tipsoff">Turn off tips</button>' : ''}<span style="flex:1"></span><button class="btn primary" data-c="-1">${n.kind === 'tip' ? 'Got it' : 'OK'}</button>`;
    if (!m.foot.innerHTML.trim()) m.foot.hidden = true;
    const done = () => { m.close(); this.card = null; this.renderNotes(); };
    m.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-c],[data-x]');
      if (!b || b.disabled) return;
      AudioEngine.sfx('click');
      if (b.dataset.x === 'tipsoff') { S.tipsOff = true; S.notes = S.notes.filter((q) => q.kind !== 'tip'); toast('Tips turned off. You can turn them back on in Settings.'); done(); return; }
      if (b.dataset.x === 'cont') { done(); return; }
      const idx = +b.dataset.c;
      const ch = choices && choices[idx];
      m.outcome = true;
      const out = resolveNote(n.id, idx);
      if (out && (out.text || (out.chips && out.chips.length) || out.letters)) this.showOutcome(m, n, out, done);
      else done();
      if (ch && !ch.run) Bus.emit('noteAction');
    });
    const first = m.el.querySelector('.ev-choice.pri, .ev-choice, [data-c="-1"]');
    if (first) first.focus({ preventScroll: true });
    AudioEngine.sfx(isResult && n.good === false ? 'error' : n.kind === 'event' ? 'note' : 'chime');
  },
  // After a decision: what happened, with every number that moved.
  showOutcome(m, n, out, done) {
    const good = out.chips.length ? out.chips.filter((c) => c.good).length >= out.chips.length / 2 : true;
    m.el.querySelector('.modal').style.setProperty('--ec', good ? '#2A9A62' : '#B23429');
    m.body.innerHTML = `<div class="ev-head"><span class="ev-ico" style="--ec:${good ? '#2A9A62' : '#B23429'}">${icon(good ? 'check' : 'spark')}</span><span class="ev-kicker">What happened</span></div>
      <h2 class="ev-title">${esc(n.title)}</h2>
      ${out.text ? `<p class="ev-text">${esc(out.text)}</p>` : ''}
      ${out.letters ? `<div class="letters">${out.letters.map((l, i) => `<div class="letter" style="--r:${[-1.5, 1, -0.5][i % 3]}deg"><p class="l-open">${esc(l.open)}</p><p>${esc(l.body)}</p><p class="l-sign">${esc(l.sign)}</p></div>`).join('')}</div>` : ''}
      ${out.chips.length ? `<div class="chips">${chipsHTML(out.chips)}</div>` : '<p class="ev-none">Nothing else changed.</p>'}
      ${out.later ? `<p class="ev-later">${icon('calendar')} This could come back later.</p>` : ''}`;
    m.foot.hidden = false;
    m.foot.innerHTML = `<span style="flex:1"></span><button class="btn primary" data-x="cont">Continue</button>`;
    m.foot.querySelector('[data-x=cont]').focus({ preventScroll: true });
    AudioEngine.sfx(good ? 'cash' : 'page');
  },
  toast(text, kind, ic) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = (ic && ICONS[ic] ? icon(ic) : '') + `<span>${esc(text)}</span>`;
    this.els.toasts.appendChild(el);
    while (this.els.toasts.children.length > 4) this.els.toasts.firstChild.remove();
    setTimeout(() => el.remove(), 4100);
    if (kind === 'gold' || kind === 'success') AudioEngine.sfx(kind === 'gold' ? 'cert' : 'click');
  },
  // Confetti over everything, dialogs included.
  confetti(n) {
    if (Office.reduced) return;
    let cv = this.confettiCv;
    if (!cv) {
      cv = this.confettiCv = document.createElement('canvas');
      cv.className = 'confetti-layer';
      document.body.appendChild(cv);
      this.confettiParts = [];
    }
    const W = cv.width = window.innerWidth, H = cv.height = window.innerHeight;
    const cols = ['#D9473C', '#3B78DD', '#E2A72C', '#2A9A62', '#6550D2', '#E07E1A', '#F4F3F7'];
    for (let i = 0; i < (n || 120); i++) this.confettiParts.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.5, y: H * 0.35, vx: (Math.random() - 0.5) * 900, vy: -300 - Math.random() * 600, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, col: cols[i % cols.length], t: 0, life: 3 + Math.random() * 1.5 });
    if (this.confettiRun) return;
    this.confettiRun = true;
    let last = performance.now();
    const ctx = cv.getContext('2d');
    const step = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      ctx.clearRect(0, 0, cv.width, cv.height);
      const P = this.confettiParts;
      for (let i = P.length - 1; i >= 0; i--) {
        const c = P[i]; c.t += dt;
        if (c.t > c.life || c.y > cv.height + 30) { P.splice(i, 1); continue; }
        c.vy += 900 * dt; c.vx *= 0.985; c.vy = Math.min(c.vy, 260 + Math.sin(c.t * 5 + i) * 40);
        c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
        ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = Math.min(1, (c.life - c.t) * 1.5);
        ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h * Math.abs(Math.cos(c.t * 6 + i)) + 1);
        ctx.restore();
      }
      if (P.length) requestAnimationFrame(step); else { this.confettiRun = false; ctx.clearRect(0, 0, cv.width, cv.height); }
    };
    requestAnimationFrame(step);
  },
  stamp(text) {
    const el = document.createElement('div');
    el.className = 'stamp';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
  },
  // ---------- action dock: the main things you can do, always in view ----------
  buildDock() {
    const d = this.els.dock = this.els.dock || $('#dock');
    this.els.goal = this.els.goal || $('#goal');
    d.hidden = false;
    this.dockKey = '';
    if (!d.dataset.bound) {
      d.dataset.bound = '1';
      d.addEventListener('click', (e) => {
        const b = e.target.closest('.dk');
        if (!b) return;
        e.stopPropagation();
        AudioEngine.ensure();
        const it = (this.dockList || []).find((x) => x.id === b.dataset.id);
        if (!it) return;
        if (it.disabled) { AudioEngine.sfx('click'); toast(it.why || 'Not available yet', 'info', it.locked ? 'lock' : 'bulb'); return; }
        AudioEngine.sfx('click');
        b.classList.remove('spot');
        it.run(b);
      });
      this.els.goal.addEventListener('click', (e) => {
        AudioEngine.ensure();
        const go = e.target.closest('[data-go]');
        if (go) { AudioEngine.sfx('click'); const A = goalAction(go.dataset.go); if (A && A.ok()) A.run(); return; }
        if (e.target.closest('button') && !e.target.closest('[data-tog]')) return;
        AudioEngine.sfx('click');
        this.goalOpen = !this.goalOpen;
        this.renderGoal(true);
      });
    }
    this.renderDock(true);
    this.renderGoal(true);
  },
  renderDock(force) {
    const d = this.els.dock;
    if (!d || d.hidden || !S) return;
    const items = dockItems();
    const key = JSON.stringify(items.map((x) => [x.id, x.label, x.disabled, x.badge, x.pulse, x.prog != null ? Math.round(x.prog * 40) : -1, x.main]));
    this.dockList = items;
    if (!force && key === this.dockKey) return;
    this.dockKey = key;
    const spot = d.querySelector('.dk.spot');
    const spotId = spot ? spot.dataset.id : null;
    d.innerHTML = items.map((it) => it.sep ? '<span class="dk-sep" aria-hidden="true"></span>' : `<button class="dk ${it.main ? 'main' : ''} ${it.pulse ? 'pulse' : ''} ${it.disabled ? 'off' : ''} ${it.id === spotId ? 'spot' : ''}" data-id="${it.id}" style="--c:${it.col}" aria-label="${esc(it.label)}${it.disabled && it.why ? ': ' + esc(it.why) : ''}" title="${esc(it.disabled ? it.why || '' : it.title || it.label)}" ${it.disabled ? 'aria-disabled="true"' : ''}>
      <span class="dk-ico">${icon(it.locked ? 'lock' : it.icon)}${it.badge ? `<span class="dk-badge num">${esc(it.badge)}</span>` : ''}</span>
      <span class="dk-lbl">${esc(it.label)}</span>
      ${it.prog != null ? `<span class="dk-prog"><i style="width:${Math.round(it.prog * 100)}%"></i></span>` : ''}
    </button>`).join('');
  },
  renderGoal(force) {
    const el = this.els.goal;
    if (!el || !S) return;
    const cg = currentGoal();
    const key = cg ? [cg.g.id, cg.v, cg.n, cg.hint, Math.round(cg.frac * 50)].join('|') : 'none';
    if (!force && key === this.goalKey) return;
    this.goalKey = key;
    el.hidden = !cg;
    const setB = () => document.documentElement.style.setProperty('--goal-b', (el.hidden || !el.offsetHeight ? 70 : Math.round(el.getBoundingClientRect().bottom + 8)) + 'px');
    if (!cg) { setB(); return; }
    const big = cg.n >= 1000;
    const count = cg.n > 1 ? `<span class="num">${big ? fmtNum(cg.v) : cg.v} / ${big ? fmtNum(cg.n) : cg.n}</span>` : '';
    el.innerHTML = `<div class="goal-ico">${icon('flag')}</div>
      <div class="goal-txt"><small>Goal ${cg.idx + 1} of ${GOALS.length}</small><b>${esc(cg.g.text)}</b>
        ${cg.bar ? `<div class="goal-bar"><i style="width:${Math.round(cg.frac * 100)}%"></i></div>` : ''}
        <div class="goal-meta">${count}${cg.hint ? `<span>${esc(cg.hint)}</span>` : ''}</div></div>
      <button class="goal-tog" data-tog aria-expanded="${this.goalOpen ? 'true' : 'false'}" aria-label="How to reach this goal" title="How?">${icon('chev')}</button>
      ${this.goalOpen ? `<div class="goal-how"><p>${esc(cg.g.how || '')}</p>${(() => { const A = goalAction(cg.g.act); return A && A.ok() ? `<button class="btn sm primary" data-go="${cg.g.act}">${esc(A.label)}</button>` : ''; })()}</div>` : ''}`;
    setB();
  },
  // Points at where something lives: a glowing dock button, or the matching menu entry.
  spotlight(act) {
    const map = { new: 'main', market: 'market', research: 'research', staff: 'staff', charts: 'charts', scout: 'artists', contracts: 'contracts', artists: 'artists' };
    const d = this.els.dock;
    const id = map[act];
    let b = id && d ? d.querySelector(`.dk[data-id="${id}"]`) : null;
    if (b && b.classList.contains('off') && id === 'main' && act !== 'new') b = null;
    if (b) {
      d.querySelectorAll('.dk.spot').forEach((x) => x.classList.remove('spot'));
      void b.offsetWidth;
      b.classList.add('spot');
      clearTimeout(this.spotTimer);
      this.spotTimer = setTimeout(() => b.classList.remove('spot'), 4200);
      const it = (this.dockList || []).find((x) => x.id === id);
      if (it && it.disabled && it.why) toast(it.why, 'info', 'lock');
      return;
    }
    // things that live in the full menu
    const menuId = { disco: 'disco', office: 'office', formats: 'formats', finances: 'fin' }[act] || act;
    const more = d && d.querySelector('.dk[data-id="more"]');
    const r = more ? more.getBoundingClientRect() : { left: window.innerWidth - 300, top: window.innerHeight - 100, right: window.innerWidth - 20 };
    this.openMenu(r.left, r.top - 8, { above: true, spot: menuId });
  },
  openMenuAtDock() {
    const more = this.els.dock && !this.els.dock.hidden ? this.els.dock.querySelector('.dk[data-id="more"]') : null;
    if (more) { const r = more.getBoundingClientRect(); this.openMenu(r.left, r.top - 8, { above: true }); return; }
    const r = this.els.hud.querySelector('.mnu').getBoundingClientRect();
    this.openMenu(r.right - 270, r.bottom + 8);
  },
  // ---------- context menu ----------
  openMenu(x, y, mo) {
    mo = mo || {};
    // the click that just closed the menu shouldn't open it again
    if (performance.now() - (this.menuJustClosed || 0) < 400) return;
    this.closeMenu();
    if (!S || S.gameOver) return;
    AudioEngine.sfx('menu');
    const items = menuItems();
    const el = document.createElement('div');
    el.className = 'menu';
    el.setAttribute('role', 'menu');
    let html = '';
    for (const sec of items) {
      if (!sec.items.length) continue;
      html += `<div class="menu-sec">${esc(sec.name)}</div>`;
      for (const it of sec.items) {
        html += `<button class="mi ${it.hl ? 'hl' : ''}" role="menuitem" data-id="${it.id}" ${it.disabled ? 'disabled' : ''} title="${esc(it.title || '')}">${icon(it.icon)}<span>${esc(it.label)}</span>${it.badge ? `<span class="badge">${esc(it.badge)}</span>` : it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}</button>`;
      }
    }
    el.innerHTML = html;
    this.els.menuRoot.appendChild(el);
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = clamp(x, 8, window.innerWidth - w - 8) + 'px';
    el.style.top = clamp(mo.above ? y - h : y, 8, window.innerHeight - h - 8) + 'px';
    if (mo.spot) { const sp = el.querySelector(`.mi[data-id="${mo.spot}"]`); if (sp) sp.classList.add('spot'); }
    el.querySelectorAll('.mi').forEach((b) => b.addEventListener('click', (e) => {
      e.stopPropagation();
      const it = items.flatMap((s) => s.items).find((q) => q.id === b.dataset.id);
      this.closeMenu();
      AudioEngine.sfx('click');
      if (it && it.run) it.run();
    }));
    this.menuEl = el;
    const first = el.querySelector('.mi.spot') || el.querySelector('.mi:not([disabled])');
    if (first) first.focus({ preventScroll: true });
    setTimeout(() => document.addEventListener('pointerdown', this._closer = (e) => { if (!el.contains(e.target)) { this.closeMenu(); this.menuJustClosed = performance.now(); } }, { once: false }), 0);
  },
  closeMenu() {
    if (this.menuEl) { this.menuEl.remove(); this.menuEl = null; }
    if (this._closer) { document.removeEventListener('pointerdown', this._closer); this._closer = null; }
  },
  // ---------- modals ----------
  modal(o) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${o.cls || ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title || '')}">
      ${o.title != null ? `<div class="modal-head">${o.headLeft || ''}<div style="flex:1;min-width:0"><h2>${esc(o.title)}</h2>${o.sub ? `<div class="sub">${esc(o.sub)}</div>` : ''}</div>${o.closable === false ? '' : `<button class="x" aria-label="Close">${icon('x')}</button>`}</div>` : ''}
      <div class="modal-body"></div>
      <div class="modal-foot" ${o.foot === false ? 'hidden' : ''}></div>
    </div>`;
    this.els.modalRoot.appendChild(back);
    const m = {
      el: back, body: back.querySelector('.modal-body'), foot: back.querySelector('.modal-foot'), closable: o.closable !== false,
      close: () => {
        if (!back.isConnected) return;
        back.remove();
        this.modals = this.modals.filter((x) => x !== m);
        if (o.onClose) o.onClose();
        Main.onModalChange();
      },
    };
    const x = back.querySelector('.x');
    if (x) x.addEventListener('click', () => { AudioEngine.sfx('click'); m.close(); });
    back.addEventListener('pointerdown', (e) => { if (e.target === back && m.closable && o.backdropClose !== false) m.close(); });
    this.modals.push(m);
    this.closeMenu();
    Main.onModalChange();
    AudioEngine.sfx('open');
    return m;
  },
  topModal() { return this.modals[this.modals.length - 1] || null; },
  closeAll() { for (const m of this.modals.slice()) m.close(); },
  onKey(e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === 'Escape') {
      if (this.menuEl) { this.closeMenu(); return; }
      const m = this.topModal();
      if (m) { if (m.closable) m.close(); return; }
      if (S && Main.mode === 'play' && !S.gameOver) this.openMenuAtDock();
      return;
    }
    if (!S || Main.mode !== 'play' || this.modals.length) return;
    if (e.key === ' ') { e.preventDefault(); Main.setSpeed(Main.userPaused ? S.speed : 0); }
    else if (e.key === '1') Main.setSpeed(1);
    else if (e.key === '2') Main.setSpeed(2);
    else if (e.key === '3') Main.setSpeed(4);
    else if (e.key === 'm' || e.key === 'M') this.openMenuAtDock();
  },
};

// ---------- menu contents ----------
function menuItems() {
  const p = S.project, k = S.contract;
  const make = [];
  if (!p && !k) {
    make.push({ id: 'new', icon: 'disc', label: 'New record', hl: true, run: () => openNewRecord() });
    make.push({ id: 'contract', icon: 'brief', label: 'Contract work', run: () => openContracts() });
  } else if (p) {
    if (p.stage >= 3) make.push({ id: 'release', icon: 'disc', label: 'Release the record', hl: true, run: () => openRelease() });
    make.push({ id: 'market', icon: 'mega', label: 'Marketing', run: () => openMarketing() });
    make.push({ id: 'shelve', icon: 'x', label: 'Shelve this record', run: () => confirmBox('Shelve this record?', `"${p.title}" will be cancelled and the money spent on it is lost.`, 'Shelve it', () => cancelProject()) });
  } else {
    make.push({ id: 'cancelk', icon: 'x', label: 'Drop contract', hint: `-${fmtMoney(k.penalty)}`, run: () => confirmBox('Drop this contract?', `The client will charge a ${fmtMoney(k.penalty)} penalty.`, 'Drop it', () => cancelContract()) });
  }
  if (!p && S.hypeBank < HYPE_MAX && S.releases.length >= 1) make.push({ id: 'market2', icon: 'mega', label: 'Pre-release marketing', run: () => openMarketing() });
  const label = [];
  label.push({ id: 'roster', icon: 'mic', label: 'Artists', badge: S.artists.length + '/' + rosterMax(), run: () => openRoster() });
  if (S.releases.length >= 2 || S.artists.length < 1) label.push({ id: 'scout', icon: 'star', label: 'Scout talent', hint: S.pending.some((x) => x.kind === 'scout') ? 'searching' : '', run: () => openScout() });
  if (S.office >= 2) label.push({ id: 'staff', icon: 'users', label: 'Staff', badge: S.staff.length + '/' + staffMax(), run: () => openStaff() });
  const ra = RESEARCH.filter((r) => researchStatus(r).state === 'ok').length;
  if (S.releases.length >= 1 || S.insp >= 5) label.push({ id: 'research', icon: 'flask', label: 'Research', badge: ra ? String(ra) : '', run: () => openResearch() });
  if (S.cands.hire) label.push({ id: 'cands-hire', icon: 'users', label: 'Job candidates', badge: '!', run: () => openCandidates('hire') });
  if (S.cands.scout) label.push({ id: 'cands-scout', icon: 'star', label: 'Scouted acts', badge: '!', run: () => openCandidates('scout') });
  const biz = [];
  biz.push({ id: 'formats', icon: 'tape', label: 'Formats', run: () => openFormats() });
  if (S.releases.length) {
    const pend = S.releases.filter((r) => !r.active && !r.reportDone).length;
    biz.push({ id: 'disco', icon: 'note', label: 'Discography', badge: pend ? String(pend) : '', run: () => openDiscography() });
    biz.push({ id: 'charts', icon: 'chart', label: 'Charts', run: () => openCharts() });
  }
  biz.push({ id: 'fin', icon: 'coin', label: 'Finances', run: () => openFinances() });
  const mv = moveStatus();
  biz.push({ id: 'office', icon: 'building', label: mv.ok ? 'Move to a bigger place' : 'Office', hl: mv.ok, run: () => openOffice() });
  const game = [
    { id: 'settings', icon: 'gear', label: 'Save & settings', run: () => openSettings() },
    { id: 'help', icon: 'help', label: 'How to play', run: () => openHelp() },
  ];
  return [{ name: 'Make music', items: make }, { name: 'Your label', items: label }, { name: 'Business', items: biz }, { name: 'Game', items: game }];
}
// The goal tracker's shortcut, shown only when it can do something right now.
function goalAction(act) {
  const A = {
    new: { label: 'Start a new record', ok: () => !busyReason() && S.artists.some((a) => artistAvailable(a).ok), run: () => openNewRecord() },
    disco: { label: 'Open Discography', ok: () => S.releases.length > 0, run: () => openDiscography() },
    research: { label: 'Open Research', ok: () => S.releases.length >= 1 || S.insp >= 5, run: () => openResearch() },
    market: { label: 'Open Marketing', ok: () => !!S.project || (S.releases.length >= 1 && S.hypeBank < HYPE_MAX), run: () => openMarketing() },
    office: { label: 'Open Office', ok: () => true, run: () => openOffice() },
    staff: { label: 'Open Staff', ok: () => S.office >= 2, run: () => openStaff() },
    charts: { label: 'Open Charts', ok: () => S.releases.length > 0, run: () => openCharts() },
    scout: { label: 'Scout talent', ok: () => S.artists.length < rosterMax(), run: () => openScout() },
  };
  return A[act] || null;
}
// The dock across the bottom of the screen. Positions never move; buttons lock with a reason instead.
function dockItems() {
  const p = S.project, k = S.contract;
  const items = [];
  if (p) {
    const ready = p.stage >= 3;
    items.push({ id: 'main', main: true, icon: 'disc', col: 'var(--label)', label: ready ? 'Release' : 'In the studio', disabled: !ready, why: `"${p.title}" is still being made. Release unlocks once production is done.`, pulse: ready, prog: ready ? null : clamp((p.stage + (p.len ? p.st / p.len : 0)) / 3, 0, 1), run: () => openRelease() });
  } else if (k) {
    items.push({ id: 'main', main: true, icon: 'brief', col: 'var(--label)', label: 'On contract', disabled: true, why: `Your team is busy with "${k.title || k.name || 'contract work'}". New records can start once it's done.`, prog: k.weeks ? clamp(1 - k.left / k.weeks, 0, 1) : null, run: () => {} });
  } else {
    const free = S.artists.some((a) => artistAvailable(a).ok);
    items.push({ id: 'main', main: true, icon: 'disc', col: 'var(--label)', label: 'New record', pulse: true, title: free ? 'Start recording a new record' : 'No artist is free right now', run: () => openNewRecord() });
  }
  const busy = !!(p || k);
  items.push({ id: 'contracts', icon: 'brief', col: '#2F8F64', label: 'Contracts', disabled: busy, why: 'Finish your current work before taking a contract.', title: 'Jingles and TV jobs that pay the bills', run: () => openContracts() });
  items.push({ sep: true, id: 's1' });
  const scoutWaiting = !!S.cands.scout;
  items.push({ id: 'artists', icon: 'mic', col: '#A4519A', label: 'Artists', badge: scoutWaiting ? '!' : `${S.artists.length}/${rosterMax()}`, title: 'Your roster, tours and scouting', run: () => (scoutWaiting ? openCandidates('scout') : openRoster()) });
  const staffLocked = S.office < 2;
  items.push({ id: 'staff', icon: 'users', col: '#3B78DD', label: 'Staff', locked: staffLocked, disabled: staffLocked, why: 'Move to the Downtown Studio to hire staff.', badge: S.cands.hire ? '!' : staffLocked ? '' : `${S.staff.length}/${staffMax()}`, title: 'Hire, train and manage your team', run: () => (S.cands.hire ? openCandidates('hire') : openStaff()) });
  const ra = RESEARCH.filter((r) => researchStatus(r).state === 'ok').length;
  const resOpen = S.releases.length >= 1 || S.insp >= 5;
  items.push({ id: 'research', icon: 'flask', col: '#C8901C', label: 'Research', disabled: !resOpen, why: 'Your team collects Inspiration (yellow bulbs) while making records. Spend it here.', badge: ra ? String(ra) : '', title: 'Spend Inspiration on new themes, gear and skills', run: () => openResearch() });
  items.push({ sep: true, id: 's2' });
  const mktOk = !!p || (S.releases.length >= 1 && S.hypeBank < HYPE_MAX);
  items.push({ id: 'market', icon: 'mega', col: '#E07E1A', label: 'Marketing', disabled: !mktOk, why: S.hypeBank >= HYPE_MAX ? 'Hype is already at the maximum.' : 'Start a record first, then build hype for it.', title: 'Build hype before a release', run: () => openMarketing() });
  items.push({ id: 'charts', icon: 'chart', col: '#6550D2', label: 'Charts', disabled: !S.releases.length, why: 'Release a record to see the charts.', title: 'The Hot 100 and the Album chart', run: () => openCharts() });
  const mv = moveStatus();
  const pend = S.releases.filter((r) => !r.active && !r.reportDone).length;
  items.push({ id: 'more', icon: 'more', col: 'var(--ink)', label: 'More', badge: pend ? String(pend) : mv.ok ? '!' : '', title: 'Discography, office, formats, finances and settings', run: (b) => { const r = b.getBoundingClientRect(); UI.openMenu(r.left, r.top - 8, { above: true }); } });
  return items;
}
function confirmBox(title, text, okLabel, onOk) {
  const m = UI.modal({ title, cls: 'narrow' });
  m.body.innerHTML = `<p style="font-weight:700;color:var(--ink-2)">${esc(text)}</p>`;
  m.foot.innerHTML = `<button class="btn" data-a="no">Cancel</button><button class="btn primary" data-a="ok">${esc(okLabel)}</button>`;
  m.foot.querySelector('[data-a=no]').addEventListener('click', () => m.close());
  m.foot.querySelector('[data-a=ok]').addEventListener('click', () => { m.close(); onOk(); });
}

}
function whyLine(st) { return st.ok ? '' : `<div class="why">${icon(/^(Research|Needs|Available)/.test(st.reason || '') ? 'lock' : /cash/.test(st.reason || '') ? 'coin' : 'spark')}${esc(st.reason || '')}</div>`; }
function energyCol(e) { return e > 60 ? '#2FBF71' : e > 30 ? '#F5B82E' : '#E5484D'; }

// Little record-shop pictograms for the record types.
function typePic(id) {
  const disc = (cx, cy, r, lab) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#1F1B2B"/><circle cx="${cx}" cy="${cy}" r="${r * 0.72}" fill="none" stroke="#3A3446" stroke-width="0.8"/><circle cx="${cx}" cy="${cy}" r="${r * 0.36}" fill="${lab}"/><circle cx="${cx}" cy="${cy}" r="1" fill="#1F1B2B"/>`;
  const sleeve = (x, y, w, c, c2) => `<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="2" fill="${c}"/><rect x="${x + 4}" y="${y + 4}" width="${w - 8}" height="${(w - 8) * 0.55}" rx="1.5" fill="${c2}"/>`;
  const svg = {
    single: disc(20, 16, 11, '#D9473C'),
    ep: disc(15, 17, 10, '#3B78DD') + disc(25, 15, 10, '#E2A72C'),
    album: disc(25, 16, 12.5, '#A4519A') + sleeve(4, 3, 26, '#E07E1A', '#F4C27A'),
    concept: disc(29, 16, 10.5, '#2F8F64') + sleeve(9, 4, 22, '#6550D2', '#B6A9F0') + sleeve(2, 7, 22, '#3B78DD', '#9CC0F5'),
  }[id] || disc(20, 16, 11, '#868097');
  return `<svg class="tpic" viewBox="0 0 40 32" aria-hidden="true">${svg}</svg>`;
}
function openNewRecord() {

  const last = S.releases.filter((r) => r.type !== 'hits').slice(-1)[0];
  const st = {

  const m = UI.modal({ title: 'New record', sub: `${fmtDate(S.week)} · ${S.label}`, cls: 'wide', headLeft: '<img class="avatar" id="nr-cover" alt="" style="border-radius:10px">' });
  m.body.innerHTML = `
    <div class="grid2">

        <div><div class="sec-title">Type</div><div class="seg" id="nr-types"></div></div>

      </div>
      <div style="display:grid;gap:16px;align-content:start">
        <div><div class="sec-title">Genre <span class="aside">${icon('star')} artist's genre</span></div><div class="wrap" id="nr-genres"></div></div>
        <div><div class="sec-title">Theme <span class="aside">combos you've discovered are marked</span></div><div class="wrap" id="nr-themes"></div></div>

  titleEl.addEventListener('input', () => { st.title = titleEl.value; renderCover(); });

  const render = () => {

        ${typePic(T.id)}<span class="otx"><b>${esc(T.name)}</b><span>${ts.ok ? `${fmtMoney(projectCost(T.id))} · ${T.weeks * 3} wks` : esc(ts.reason)}</span></span></button>`;
    }).join('');
    // artists
    m.body.querySelector('#nr-artists').innerHTML = S.artists.map((a) => {
      const av = artistAvailable(a);
      return `<div class="card ${st.artistId === a.id ? 'sel' : ''} ${av.ok ? 'click' : ''}" data-artist="${a.id}" style="${av.ok ? '' : 'opacity:.5'};padding:8px 10px">
        <div class="row"><img class="avatar sm" alt="" src="${artistPortrait(a, 38)}">
        <div class="grow"><div class="name" style="font-size:14px">${esc(a.name)}</div><div class="meta">${esc(GENRE[a.genre].name)}${a.genre2 ? ' / ' + esc(GENRE[a.genre2].name) : ''} · Talent ${a.talent} · ${av.ok ? `Energy ${Math.round(a.energy)}` : esc(av.reason)}</div></div>
        ${av.ok && a.energy < 40 ? `<span class="tag bad">${icon('battery')} Tired</span>` : ''}</div></div>`;
    }).join('') || '<div class="empty">No artists available right now.</div>';

    const allOpen = FORMATS.filter((f) => formatOpen(f.id));
    m.body.querySelector('#nr-formats').innerHTML = allOpen.map((f) => {
      const owned = S.formatsOwned.includes(f.id);

    }).join('');
    // hint & footer
    const T = PTYPES[st.type];
    const reach = formatReach(st.formats, yNow);
    const g = GENRE[st.genre];
    const art2 = getArtist(st.artistId);

    const known = st.theme ? S.know.combo[st.genre + '|' + st.theme] : null;
    m.body.querySelector('#nr-hint').innerHTML = `
      <div class="sec-title" style="margin:0">${icon('bulb')} Before you start</div>
      <div class="small" style="font-weight:700;color:var(--ink-2);display:grid;gap:4px">
        ${firstRecord ? '<span style="color:var(--ink)">Some genre and theme pairings click and some flop. Experiment, and the critics will tell you how it went.</span>' : ''}
        <span>${esc(fitText)}</span>
        <span>${esc(g.name)} is ${trendFor(st.genre) ? 'trending right now' : genrePop(st.genre, yNow) >= 1.15 ? 'very popular' : genrePop(st.genre, yNow) >= 0.85 ? 'doing fine' : 'out of fashion'} in ${curYear()}.</span>
        <span>Your formats reach ${Math.round(reach * 100)}% of record buyers.</span>
        ${st.theme ? `<span>${known ? esc(COMBO_LABEL[known]) + ' for ' + esc(g.name) + '.' : `You haven't tried ${esc(g.name)} about ${esc(THEME[st.theme].name)} yet.`}</span>` : '<span>Pick a theme to continue.</span>'}
        ${art2 && art2.energy < 40 ? `<span style="color:var(--label-dk)">${esc(art2.name)} ${vb(art2.name, 'is', 'are')} tired (${Math.round(art2.energy)} energy).</span>` : ''}
      </div>
      <div class="nr-know"><div class="small"><b>What your reports taught you about ${esc(g.name)}</b><span>K is key, U is useful, M is minor. The studio sliders mark the same areas.</span></div>${knowledgeGrid(st.genre)}</div>`;
    const cost = projectCost(st.type);
    m.foot.innerHTML = `<div class="grow"><span id="nr-err" class="err"></span><span id="nr-sum">${esc(T.name)} · ${fmtMoney(cost)} · ${T.weeks * 3} weeks in the studio</span></div>

  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a],[data-type],[data-artist],[data-genre],[data-theme],[data-fmt]');
    if (!b || !m.el.contains(b)) return;
    if (b.dataset.a === 'dice') { rollTitle(); titleEl.value = st.title; renderCover(); return; }
    if (b.dataset.a === 'cancel') { m.close(); return; }
    if (b.dataset.a === 'start') {
      if (!st.theme) { showErr('Pick a theme.'); return; }
      const res = startProject({ title: titleEl.value, type: st.type, artistId: st.artistId, genre: st.genre, theme: st.theme, formats: st.formats, seed: st.seed });
      if (res.error) { showErr(res.error); return; }
      m.close();
      AudioEngine.sfx('stage');
      openStageDialog();
      return;
    }
    if (b.dataset.type) { if (typeStatus(b.dataset.type).ok) { st.type = b.dataset.type; render(); } else AudioEngine.sfx('error'); return; }
    if (b.dataset.artist) {
      const a = getArtist(b.dataset.artist);
      if (!artistAvailable(a).ok) { AudioEngine.sfx('error'); return; }
      st.artistId = a.id;
      if (S.genresOn.includes(a.genre)) st.genre = a.genre;
      render(); return;
    }
    if (b.dataset.genre) { st.genre = b.dataset.genre; render(); return; }
    if (b.dataset.theme) { st.theme = b.dataset.theme; render(); return; }
    if (b.dataset.fmt) {
      const f = b.dataset.fmt;
      if (!S.formatsOwned.includes(f)) { m.close(); openFormats(); return; }
      if (st.formats.includes(f)) { if (st.formats.length > 1) st.formats = st.formats.filter((x) => x !== f); }
      else { st.formats.push(f); if (st.formats.length > maxFormats()) st.formats.shift(); }
      render();
    }
  });
}

function openNoArtist() {
  const m = UI.modal({ title: 'No artist is free', sub: 'Every act on your roster is busy right now', cls: 'narrow' });
  const canScout = S.artists.length < rosterMax() && (S.releases.length >= 2 || S.artists.length < 1);
  const opts = [];
  if (S.artists.some((a) => a.recordsLeft <= 0)) opts.push('re-sign an artist whose contract is up');
  if (canScout) opts.push('scout new talent');
  opts.push('take on contract work while you wait');
  const sentence = opts.join(', or ').replace(/^./, (c) => c.toUpperCase()) + '.';
  m.body.innerHTML = `<div class="list">${S.artists.map((a) => `<div class="row"><img class="avatar sm" alt="" src="${artistPortrait(a, 38)}"><div class="grow"><b>${esc(a.name)}</b><div class="meta">${esc(artistStatus(a))}</div></div></div>`).join('')}</div>
    <p class="small" style="font-weight:700;color:var(--ink-2)">${esc(sentence)}</p>`;
  const renew = S.artists.find((a) => a.recordsLeft <= 0);
  m.foot.innerHTML = `<button class="btn" data-a="close">OK</button>${renew ? `<button class="btn" data-a="renew">${icon('mic')} Artists</button>` : canScout ? `<button class="btn" data-a="scout">${icon('star')} Scout talent</button>` : ''}<button class="btn primary" data-a="contract">${icon('brief')} Contract work</button>`;
  m.foot.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    m.close();
    if (b.dataset.a === 'scout') openScout();
    else if (b.dataset.a === 'renew') openRoster();
    else if (b.dataset.a === 'contract') openContracts();
  });
}

// ---------- Stage sliders ----------
const AREA_ICON = { melody: 'note', lyrics: 'quote', arrangement: 'blocks', vocals: 'mic', instruments: 'guitar', rhythm: 'drum', mixing: 'sliders', effects: 'wave', mastering: 'gauge' };
const ROW_COL = ['#3B78DD', '#A4519A', '#E07E1A'];
const IMP_INFO = { K: { label: 'Key', bars: 3, cls: 'key' }, N: { label: 'Useful', bars: 2, cls: 'useful' }, m: { label: 'Minor', bars: 1, cls: 'minor' } };
function impMeter(c, g) {
  if (!c) return `<span class="imp unknown" title="Release ${esc(g.name)} records and read their Record Reports to learn how much this matters.">? Not known yet</span>`;
  const I = IMP_INFO[c];
  return `<span class="imp ${I.cls}" title="Learned from your Record Reports">${[1, 2, 3].map((k) => `<i class="${k <= I.bars ? 'on' : ''}"></i>`).join('')}${I.label} for ${esc(g.name)}</span>`;
}
function donutSVG(vals, cols) {
  const tot = vals.reduce((a, b) => a + b, 0) || 1;
  const r = 40, C = 2 * Math.PI * r;
  let off = 0;
  const segs = vals.map((v, i) => {
    const len = (v / tot) * C;
    const seg = len > 0.1 ? `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${cols[i]}" stroke-width="22" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>` : '';
    off += len;
    return seg;
  }).join('');
  return `<svg viewBox="0 0 120 120" class="donut" role="img" aria-label="How studio time is split">
    <circle r="${r}" cx="60" cy="60" fill="none" stroke="var(--paper-3)" stroke-width="22"/>${segs}</svg>`;
}
// What the player has learned about a genre, as a 3×3 grid of dots (stage × area).
function knowledgeGrid(gid, fresh) {
  const g = GENRE[gid];
  const known = S.know.area[gid] || [];
  const n = known.filter(Boolean).length;
  return `<div class="kgrid" title="What your Record Reports have taught you about ${esc(g.name)}">
    ${[0, 1, 2].map((st) => `<div class="krow"><span>${esc(STAGES[st].verb)}</span>${[0, 1, 2].map((i) => {
      const k = st * 3 + i, c = known[k] ? g.wc[k] : null;
      return `<b class="kd ${c ? IMP_INFO[c].cls : 'unk'} ${fresh && fresh.includes(k) ? 'fresh' : ''}" title="${esc(AREAS[k].name)}: ${c ? IMP_INFO[c].label : 'not known yet'}">${c ? IMP_INFO[c].label[0] : '?'}</b>`;
    }).join('')}</div>`).join('')}
    <div class="kfoot">${n}/9 areas known</div></div>`;
}
function openStageDialog() {
  const p = S.project;
  if (!p || p.awaiting !== 'sliders') return;

  S.lastSliders = S.lastSliders || {};
  const remembered = S.lastSliders[p.genre] && S.lastSliders[p.genre][stage];
  const vals = remembered ? remembered.map((v) => clamp(Math.round(v / 10) * 10, 0, 100)) : [50, 50, 50];
  const chosen = new Set();
  const extras = EXTRAS.filter((x) => x.stage === stage && hasR(x.research));
  const STG = STAGES[stage];
  const m = UI.modal({ title: `${STG.name}`, sub: `Stage ${stage + 1} of 3 · "${p.title}" · ${g.name} about ${THEME[p.theme].name}`, closable: false, backdropClose: false, cls: 'wide' });
  m.kind = 'stage';
  const firstTime = !S.tips.slidersInline;
  S.tips.slidersInline = 1;
  // feedback from the last finished record in this genre
  const lastRel = S.releases.slice().reverse().find((r) => r.genre === p.genre && r.reportDone && r.report && r.report.focus && r.report.focus[stage]);
  const lastFocus = lastRel ? lastRel.report.focus[stage] : null;
  const ratioKnown = S.know.ratio[p.genre];
  const ratioText = g.r >= 0.6 ? 'Creativity matters more than sound' : g.r <= 0.45 ? 'Sound matters more than creativity' : 'Wants a balance of creativity and sound';
  const shares = () => { const tot = vals[0] + vals[1] + vals[2] || 1; return vals.map((v) => Math.round((v / tot) * 100)); };
  const rowHTML = (i) => {
    const k = stage * 3 + i;
    const ar = AREAS[k];
    const c = known[k] ? g.wc[k] : null;
    const target = c ? Math.round(g.w[k] * 100) : null;

    return `<div class="focus-row" style="--c:${ROW_COL[i]}">
      <div class="aico">${icon(AREA_ICON[ar.id] || 'disc')}</div>
      <div class="lbl"><b>${esc(ar.name)}</b>${impMeter(c, g)}</div>
      <div class="pct num" data-pct="${i}">${shares()[i]}%</div>
      <div class="segbar" role="slider" tabindex="0" aria-label="${esc(ar.name)} effort" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${vals[i]}" data-i="${i}">
        ${Array.from({ length: 10 }, (_, s2) => `<span class="sg ${s2 < vals[i] / 10 ? 'on' : ''}"></span>`).join('')}
        ${target != null ? `<b class="target" style="left:${Math.min(98, Math.max(2, target - 5))}%" title="Your Record Reports suggest about this much"></b>` : ''}
      </div>
      <div class="desc">${esc(ar.desc)} · ${lean}</div>
    </div>`;
  };
  const render = () => {
    m.body.innerHTML = `
      ${firstTime ? `<div class="card hint-card"><div class="small">${icon('bulb')} Click or drag the bars to decide where studio time goes this stage. Every genre needs different things. Record Reports reveal what matters, and once you know, it shows up here as meters and <b>▼</b> markers.</div></div>` : ''}
      <div class="stage-grid">
        <div class="donut-wrap">
          <div class="dn" data-donut>${donutSVG(vals, ROW_COL)}</div>
          <div class="legend">${[0, 1, 2].map((i) => `<div class="li" style="--c:${ROW_COL[i]}"><i></i>${esc(AREAS[stage * 3 + i].name)}<span class="num" data-leg="${i}">${shares()[i]}%</span></div>`).join('')}</div>
          <div class="genre-know">
            <div class="gk-head"><span class="dot" style="background:${g.color}"></span>${esc(g.name)}</div>
            ${knowledgeGrid(p.genre)}
            <div class="gk-ratio ${ratioKnown ? '' : 'unk'}">${icon('target')}${ratioKnown ? esc(ratioText) : 'Creative vs. sound balance not known yet'}</div>
            ${lastFocus ? `<div class="gk-last">Last ${esc(g.name)} record: ${esc(STG.name)} was <b class="${lastFocus === 'Spot on' ? 'ok-good' : lastFocus === 'Good' ? 'ok-fine' : 'ok-bad'}">${esc(lastFocus.toLowerCase())}</b></div>` : ''}
          </div>
        </div>
        <div class="focus-list">${[0, 1, 2].map(rowHTML).join('')}</div>
      </div>
      ${extras.length ? `<div><div class="sec-title">Studio add-ons <span class="aside">optional, paid now</span></div><div class="list">${extras.map((x) => {
        const cost = extraCost(x.id, p.type);
        const best = x.good.slice(0, 4).map((gid) => GENRE[gid] ? GENRE[gid].name : gid).join(', ');
        return `<label class="card click ${chosen.has(x.id) ? 'sel' : ''}" style="padding:10px 12px" data-x="${x.id}"><div class="row">
          <input type="checkbox" ${chosen.has(x.id) ? 'checked' : ''} data-x="${x.id}" style="width:18px;height:18px;accent-color:var(--label)">
          <div class="grow"><b>${esc(x.name)}</b> <span class="meta">${esc(x.desc)}</span>${best ? `<div class="meta">Works best with ${esc(best)}</div>` : ''}</div>
          ${x.good.includes(p.genre) ? `<span class="tag good">Great for ${esc(g.name)}</span>` : ''}
          <span class="tag num">${fmtMoney(cost)}</span></div></label>`;
      }).join('')}</div></div>` : ''}
      <div class="kv">
        <div><b class="num" style="color:var(--creative)">${Math.floor(p.C)}</b><span>Creativity so far</span></div>
        <div><b class="num" style="color:var(--tech)">${Math.floor(p.T)}</b><span>Sound so far</span></div>
        <div><b class="num" style="color:var(--flaw)">${Math.floor(p.F)}</b><span>Flaws so far</span></div>
      </div>`;
    const xcost = [...chosen].reduce((s2, x) => s2 + extraCost(x, p.type), 0);
    m.foot.innerHTML = `<div class="grow">${xcost ? `Add-ons: ${fmtMoney(xcost)}` : `${p.len} weeks of ${STG.verb.toLowerCase()}`}</div><button class="btn primary lg" data-a="go">${icon(STG.icon)} Start ${esc(STG.name.toLowerCase())}</button>`;
  };
  render();
  const refresh = (i) => {
    const bar = m.body.querySelector(`.segbar[data-i="${i}"]`);
    if (bar) {
      bar.setAttribute('aria-valuenow', vals[i]);
      bar.querySelectorAll('.sg').forEach((el, k) => el.classList.toggle('on', k < vals[i] / 10));
    }
    const sh = shares();
    m.body.querySelectorAll('[data-pct]').forEach((el) => { el.textContent = sh[+el.dataset.pct] + '%'; });
    m.body.querySelectorAll('[data-leg]').forEach((el) => { el.textContent = sh[+el.dataset.leg] + '%'; });
    const dn = m.body.querySelector('[data-donut]');
    if (dn) dn.innerHTML = donutSVG(vals, ROW_COL);
  };
  const setVal = (i, v) => {
    v = clamp(Math.round(v / 10) * 10, 0, 100);
    if (v === vals[i]) return;
    vals[i] = v;
    AudioEngine.sfx('tick', v / 100);
    refresh(i);
  };
  const fromPointer = (bar, e) => {
    const r = bar.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    return x <= 0.02 ? 0 : Math.ceil(clamp(x, 0, 1) * 10) * 10;
  };
  let drag = null;
  m.body.addEventListener('pointerdown', (e) => {
    const bar = e.target.closest('.segbar');
    if (!bar) return;
    e.preventDefault();
    drag = bar;
    try { bar.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    bar.focus({ preventScroll: true });
    setVal(+bar.dataset.i, fromPointer(bar, e));
  });
  m.body.addEventListener('pointermove', (e) => { if (drag) setVal(+drag.dataset.i, fromPointer(drag, e)); });
  const endDrag = () => { drag = null; };
  m.body.addEventListener('pointerup', endDrag);
  m.body.addEventListener('pointercancel', endDrag);
  m.body.addEventListener('keydown', (e) => {
    const bar = e.target.closest('.segbar');
    if (!bar) return;
    const i = +bar.dataset.i;
    const map = { ArrowRight: 10, ArrowUp: 10, ArrowLeft: -10, ArrowDown: -10 };
    if (map[e.key] != null) { e.preventDefault(); setVal(i, vals[i] + map[e.key]); }
    else if (e.key === 'Home') { e.preventDefault(); setVal(i, 0); }
    else if (e.key === 'End') { e.preventDefault(); setVal(i, 100); }
  });
  m.body.addEventListener('change', (e) => {
    const cb = e.target.closest('input[type=checkbox]');
    if (!cb) return;
    if (cb.checked) chosen.add(cb.dataset.x); else chosen.delete(cb.dataset.x);
    render();
  });
  m.foot.addEventListener('click', (e) => {
    if (!e.target.closest('[data-a=go]')) return;
    const res = setStage(vals, [...chosen]);
    if (res.error) { toast(res.error, 'warn'); AudioEngine.sfx('error'); return; }
    S.lastSliders[p.genre] = S.lastSliders[p.genre] || [null, null, null];
    S.lastSliders[p.genre][stage] = vals.slice();
    m.close();
    AudioEngine.sfx('stage');
    if (Main.userPaused) Main.setSpeed(S.speed || 1); // starting work means you want the clock running
    Main.syncMusic();
    if (stage === 0 && !S.tips.bubbles) setTimeout(() => tip('bubbles'), 2600);
  });
}

  const m = UI.modal({ title: 'Release the record?', sub: `${PTYPES[p.type].name} · ${a ? a.name : ''}`, cls: 'narrow' });
  const flaws = Math.ceil(p.F);
  m.body.innerHTML = `
    <div class="row" style="align-items:flex-start">
      <img alt="" src="${coverURL(p.seed, p.genre, 96)}" style="width:96px;height:96px;border-radius:12px;flex:none">
      <div class="grow" style="display:grid;gap:6px">
        <div class="name" style="font-size:20px">${esc(p.title)}</div>
        <div class="wrap">${genreChip(p.genre)}<span class="tag">${esc(THEME[p.theme].name)}</span>${p.formats.map((f) => `<span class="tag">${esc(FORMAT[f].short)}</span>`).join('')}</div>
        <div class="hype">${icon('mega')} Hype <span class="hypebar"><i style="width:${Math.min(100, p.hype / HYPE_MAX * 100)}%"></i></span> <span class="num">${Math.round(p.hype)}</span></div>
      </div>
    </div>
    <div class="kv">
      <div><b class="num" style="color:var(--creative)">${Math.floor(p.C)}</b><span>Creativity</span></div>
      <div><b class="num" style="color:var(--tech)">${Math.floor(p.T)}</b><span>Sound</span></div>
      <div><b class="num" style="color:${flaws ? 'var(--flaw)' : 'var(--good-dk)'}">${flaws}</b><span>Flaws left</span></div>
    </div>
    ${flaws ? `<p class="small" style="font-weight:700;color:var(--ink-2)">${icon('bulb')} The team is still polishing. Every flaw left in the mix costs you with the critics. Keep polishing to clean it up.</p>` : `<p class="small" style="font-weight:700;color:var(--good-dk)">${icon('check')} The mix is spotless.</p>`}`;
  m.foot.innerHTML = `<button class="btn" data-a="keep">Keep polishing</button><button class="btn" data-a="mkt">${icon('mega')} Marketing</button><button class="btn primary lg" data-a="rel">${icon('disc')} Release it</button>`;
  m.foot.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');

function verdictText(s) {
  if (s >= 9.5) return ['A masterpiece!', 'The critics are calling it a classic.'];
  if (s >= 8.5) return ['Critics adore it', 'Glowing reviews across the board.'];
  if (s >= 7) return ['Solid reviews', 'The critics liked it.'];
  if (s >= 5.5) return ['Mixed reviews', 'Some liked it, some didn\'t.'];
  if (s >= 4) return ['Lukewarm reception', 'The critics were not impressed.'];
  return ['A critical disaster', 'Ouch. Let\'s learn from this one.'];
}
function openReviews(res) {
  const rel = res.rel, rv = res.review;
  const m = UI.modal({ title: rel.title, sub: `${PTYPES[rel.type].name} by ${rel.artistName} · in stores now`, cls: 'wide', closable: false, backdropClose: false, headLeft: `<img alt="" src="${coverURL(rel.seed, rel.genre, 52)}" style="width:52px;height:52px;border-radius:10px">` });
  m.kind = 'reviews';
  m.body.innerHTML = `
    <div class="rv-status" id="rv-status"><span class="rv-dots"><i></i><i></i><i></i></span><span id="rv-msg">The critics are listening to "${esc(rel.title)}"</span></div>
    <div class="reviews">${rel.critics.map((c, i) => {
      const C = CRITICS.find((x) => x.id === c.id);
      return `<div class="critic wait" data-i="${i}" style="--c:${C.color}"><div class="cn"><i></i>${esc(C.name)}</div><div class="sc num"><span>?</span><small> / 10</small></div><q hidden>${esc(c.quote || '')}</q><div class="pen">Listening…</div></div>`;
    }).join('')}</div>
    <div class="verdict" id="verdict"><div class="big num">?</div><div style="display:grid;gap:4px"><b>Overall score</b><span>Revealed once every critic has had their say</span></div></div>`;
  m.foot.innerHTML = `<div class="grow small" id="rv-extra"></div><button class="btn ghost sm" data-a="skip">Skip ahead</button><button class="btn primary lg" data-a="ok" disabled>${icon('check')} Ship it</button>`;
  const song = buildSong(rel.genre, songIndexOf(rel), rel.theme);
  AudioEngine.stop();
  const stopTension = AudioEngine.tension();
  const cards = [...m.body.querySelectorAll('.critic')];
  const msg = m.body.querySelector('#rv-msg');
  let fast = false;
  let wake = null;
  const wait = (ms) => new Promise((resolve) => { if (fast) { setTimeout(resolve, Math.min(ms, 60)); return; } const id = setTimeout(resolve, ms); wake = () => { clearTimeout(id); resolve(); }; });
  const countUp = (el, target, ms, decimals) => new Promise((resolve) => {
    const t0 = performance.now();
    let lastShown = -1;
    const anim = (now) => {
      if (!m.el.isConnected) return resolve();
      const k = fast ? 1 : Math.min(1, (now - t0) / ms);
      const v = target * Ease.outCubic(k);
      const shown = decimals ? v.toFixed(decimals) : String(Math.round(v));
      if (shown !== String(lastShown)) { el.textContent = shown; if (!fast && Math.floor(v) !== Math.floor(lastShown)) AudioEngine.sfx('tick', v / 10); lastShown = shown; }
      if (k < 1) requestAnimationFrame(anim); else resolve();
    };
    requestAnimationFrame(anim);
  });
  const run = async () => {
    await wait(900);
    for (let i = 0; i < cards.length; i++) {
      if (!m.el.isConnected) return;
      const card = cards[i], c = rel.critics[i], C = CRITICS.find((x) => x.id === c.id);
      msg.textContent = `${C.name} is writing their review…`;
      card.classList.add('active');
      card.querySelector('.pen').textContent = 'Writing…';
      const rollLen = 0.85 + i * 0.18;
      if (!fast) AudioEngine.roll(rollLen, i === cards.length - 1);
      await wait(rollLen * 1000);
      if (!m.el.isConnected) return;
      card.classList.remove('wait', 'active');
      card.classList.add('in', c.score >= 9 ? 'rave' : c.score <= 4 ? 'pan' : 'mid');
      card.querySelector('.pen').remove();
      card.querySelector('q').hidden = false;
      AudioEngine.sfx('reveal', c.score);
      await countUp(card.querySelector('.sc span'), c.score, 380, 0);
      if (i < cards.length - 1) msg.textContent = `${C.name} gives it ${c.score} out of 10`;
      await wait(520);
    }
    if (!m.el.isConnected) return;
    msg.textContent = 'And the overall verdict is…';
    if (!fast) AudioEngine.roll(1.3, true);
    await wait(1300);
    if (!m.el.isConnected) return;
    stopTension();
    AudioEngine.sfx('crash');
    m.body.querySelector('#rv-status').classList.add('done');
    const [vt, vs] = verdictText(rel.score);
    const v = m.body.querySelector('#verdict');
    const comboTag = rv && rv.combo ? `<span class="tag ${rv.combo}">${esc(COMBO_LABEL[rv.combo])}: ${esc(GENRE[rel.genre].name)} × ${esc(THEME[rel.theme].name)}</span>` : '';
    v.innerHTML = `<div class="big num">0.0</div><div style="display:grid;gap:4px"><b>${esc(vt)}</b><span>${esc(vs)}</span><div class="wrap">${comboTag}</div></div>`;
    v.classList.add('in', rel.score >= 9 ? 'rave' : rel.score < 5 ? 'pan' : 'mid');
    await countUp(v.querySelector('.big'), rel.score, 700, 1);
    msg.textContent = 'The reviews are in.';
    AudioEngine.sfx('sting', rel.score);
    const firstWeek = Math.round(rel.U * Math.pow(1, rel.a) * Math.exp(-1 / rel.tau) / rel.norm);
    m.foot.querySelector('#rv-extra').innerHTML = `${icon('mega')} Hype ${rel.hype} · first-week estimate <b class="num">${fmtInt(firstWeek)}</b> copies`;
    const skip = m.foot.querySelector('[data-a=skip]'); if (skip) skip.remove();
    m.foot.querySelector('[data-a=ok]').disabled = false;
    if (rel.score >= 9) { AudioEngine.applause(2.6, rel.score >= 9.5); if (rel.score >= 9.5) AudioEngine.cheer(); }
    if (rel.score >= 9.5) Office.celebrate(120);
    if (rv && rv.critics.every((c) => c.score === 10)) UI.stamp('Perfect 10!');
    setTimeout(() => { if (m.el.isConnected && AudioEngine.musicOn) AudioEngine.play(song, { layer: 3 }); }, 1400);
  };
  run();
  m.foot.addEventListener('click', (e) => { if (e.target.closest('[data-a=skip]')) { fast = true; if (wake) wake(); } });
  m.foot.addEventListener('click', (e) => {
    if (!e.target.closest('[data-a=ok]') || e.target.closest('[disabled]')) return;
    m.close();
    Main.syncMusic();
    if (S.releases.filter((r) => r.type !== 'hits').length === 1) { tip('firstReview'); tip('sales'); }
    if (S.releases.length === 2) tip('marketing');
    const a = getArtist(rel.artistId);
    if (a && a.energy < 45) tip('energy');
  });
}

// ---------- Marketing ----------
function openMarketing() {
  const m = UI.modal({ title: 'Marketing', sub: S.project ? `Building hype for "${S.project.title}"` : 'Hype you build now carries over to your next record', cls: '' });
  const render = () => {
    const cur = currentHype();
    m.body.innerHTML = `
      <div class="hype" style="font-size:14px">${icon('mega')} Current hype <span class="hypebar" style="width:160px;height:10px"><i style="width:${Math.min(100, cur / HYPE_MAX * 100)}%"></i></span> <b class="num">${Math.round(cur)}</b> / ${HYPE_MAX}</div>
      <div class="list">${CAMPAIGNS.map((c) => {
        const st = campaignStatus(c);
        const hidden = c.research && !hasR(c.research) && RESEARCH_BY[c.research].req && RESEARCH_BY[c.research].req.year && curYear() < RESEARCH_BY[c.research].req.year;
        if (hidden) return '';
        const genre = S.project ? S.project.genre : null;
        const est = Math.min(Math.round(HYPE_MAX - cur), Math.round(c.hype * (genre && c.bonus.includes(genre) ? 1.3 : 1) * Math.max(0.15, 1 - cur / 250)));
        return `<div class="card" style="padding:10px 12px"><div class="row">
          <div class="grow"><b>${esc(c.name)}</b>${genre && c.bonus.includes(genre) ? ' <span class="tag good">Great for ' + esc(GENRE[genre].name) + '</span>' : ''}<div class="meta">${esc(c.desc)}</div>${whyLine(st)}</div>
          <div style="text-align:right"><div class="num" style="font-weight:900">+${est} hype</div><div class="meta num">${fmtMoney(campaignCost(c))}</div></div>
          <div class="act"><button class="btn sm ${st.ok ? 'primary' : ''}" data-c="${c.id}" ${st.ok ? '' : 'disabled'} title="${esc(st.reason || '')}">Run</button></div>
        </div></div>`;
      }).join('')}</div>
      <p class="small muted" style="font-weight:700">${cur >= HYPE_MAX - 0.5 ? 'Hype is at its peak. Release the record while the buzz is hot!' : 'Each campaign adds less once hype is already high.'}</p>`;

// ---------- Contracts ----------
function contractEstimate(k) {
  const cs = k.reqC / (k.reqC + k.reqT);
  const r = contractRates(cs);
  return Math.max(k.reqC / Math.max(0.01, r.c), k.reqT / Math.max(0.01, r.t));
}
function openContracts() {
  const why = busyReason();
  if (why) { toast(why, 'warn'); return; }
  const offers = contractOffers();
  const r = contractRates(0.5);
  const m = UI.modal({ title: 'Contract work', sub: `Your team makes about ${(r.c + r.t).toFixed(1)} points a week. New offers every two months.` });
  const render = () => {
    m.body.innerHTML = offers.length ? `<div class="list">${offers.map((k) => {
      const est = contractEstimate(k);
      const ok = est <= k.weeks * 0.92, tight = !ok && est <= k.weeks;
      const fill = Math.min(100, est / k.weeks * 100);
      return `<div class="card kcard"><div class="row">
      <div class="kico">${icon('brief', 'ico-lg')}</div>
      <div class="grow"><b>${esc(k.name)}</b><div class="meta">Needs <b style="color:var(--creative)">${k.reqC} creativity</b> and <b style="color:var(--tech)">${k.reqT} sound</b> within ${k.weeks} weeks</div>
        <div class="kfit ${ok ? 'ok' : tight ? 'tight' : 'bad'}"><span class="kbar"><i style="width:${fill.toFixed(0)}%"></i><b style="left:100%"></b></span><span>${ok ? `Your team needs about ${Math.ceil(est)} weeks` : tight ? `Tight: about ${Math.ceil(est)} of ${k.weeks} weeks` : `Too much: about ${Math.ceil(est)} weeks of work`}</span></div>
        <div class="meta">Late: ${fmtMoney(k.penalty)} penalty, or a reduced fee if it is at least 75% done</div></div>
      <div style="text-align:right"><div class="num" style="font-weight:900;font-size:18px;color:var(--good-dk)">${fmtMoney(k.pay)}</div></div>
      <button class="btn ${ok ? 'primary' : ''} sm" data-k="${k.id}">Take it</button></div></div>`;
    }).join('')}</div>` : '<div class="empty">No offers right now. Check back in a few weeks.</div>';
  };
  render();
  m.foot.innerHTML = `<button class="btn" data-a="close">Close</button>`;
  m.foot.addEventListener('click', () => m.close());

}

// ---------- Research ----------
// Research is shown in groups, cheapest first, so the next step is always at the top.
const RESEARCH_GROUPS = {
  songwriting: [['Theme packs', () => true]],
  studio: [['Record types', (r) => ['ep', 'album', 'concept', 'hits'].includes(r.id)], ['Studio add-ons', (r) => r.id.startsWith('x_')], ['Gear and upgrades', () => true]],
  business: [['Marketing', (r) => r.id.startsWith('m_')], ['Distribution', (r) => ['b_multi', 'b_global', 'b_plant'].includes(r.id)], ['Talent and touring', (r) => ['b_scouting', 'b_ar', 'b_booking'].includes(r.id)], ['Income and insight', () => true]],
  team: [['Your team', () => true]],
  lab: [['Sound Lab projects', () => true]],
};
function researchGroups(cat) {
  const left = RESEARCH.filter((r) => r.cat === cat);
  const out = [];
  for (const [name, test] of RESEARCH_GROUPS[cat] || [['Research', () => true]]) {
    const items = left.filter((r) => test(r));
    for (const r of items) left.splice(left.indexOf(r), 1);
    items.sort((a, b) => researchInsp(a) - researchInsp(b) || researchCash(a) - researchCash(b));
    if (items.length) out.push({ name, items });
  }
  return out;
}
function openResearch(cat) {
  const firstOk = RESEARCH_CATS.find((c) => (c.id !== 'lab' || S.office >= 3) && RESEARCH.some((r) => r.cat === c.id && researchStatus(r).state === 'ok'));
  let tab = cat || (firstOk ? firstOk.id : 'songwriting');
  const m = UI.modal({ title: 'Research', sub: 'Spend inspiration (and sometimes cash) to unlock new possibilities', cls: 'wide' });
  const render = () => {

    m.body.innerHTML = `
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">

        }).join('')}</div>
        <div class="pill" style="box-shadow:none">${icon('bulb')} <span class="num">${fmtInt(Math.floor(S.insp))}</span> inspiration</div>
      </div>
      ${S.lab ? `<div class="card" style="background:#F1EDFF;border-color:#D8CFFF"><div class="row">${icon('flask', 'ico-lg')}<div class="grow"><b>The Sound Lab is working on ${esc(RESEARCH_BY[S.lab.id].name)}</b><div class="meta">${S.lab.left} of ${S.lab.total} weeks left</div></div></div></div>` : ''}
      ${researchGroups(tab).map((grp) => `<div class="rgroup"><div class="sec-title">${esc(grp.name)}</div><div class="rgrid">${grp.items.map((r) => {
        const st = researchStatus(r);

        return `<div class="rcard ${st.state === 'done' ? 'done' : st.state === 'locked' ? 'locked' : ''}">
          <h4>${esc(r.name)}${lvl}</h4>

          <div class="row" style="justify-content:space-between;margin-top:4px;flex-wrap:wrap;gap:6px">
            <span class="meta">${st.state === 'done' ? '' : `<span class="bulb-cost">${icon('bulb')}${researchInsp(r)}</span>${cash ? ' + ' + fmtMoney(cash) : ''}${r.weeks ? ` · ${r.weeks} wks` : ''}`}</span>
            ${st.state === 'done' ? `<span class="tag good">${icon('check')} Done</span>` : st.state === 'pending' ? `<span class="tag">${esc(st.reason)}</span>` : st.state === 'ok' ? `<button class="btn sm primary" data-r="${r.id}">Research</button>` : `<span class="tag" title="${esc(st.reason)}">${st.state === 'locked' ? icon('lock') : ''}${esc(st.reason)}</span>`}

  };
