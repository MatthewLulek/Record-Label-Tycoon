<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Record Label Tycoon: run a record label from 1975 to 2025.">
<style>html,body{margin:0;padding:0;height:100%}</style>
<title>Record Label Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Yellowtail&display=swap">
<style>
/* Layout: full-bleed isometric studio canvas; a slim HUD rail across the top;
   quiet white panels with soft shadows float over the room. Archivo throughout,
   with its expanded width for numbers and titles, like a record sleeve. */
:root {
  --ink: #1F1B2B;
  --ink-2: #4E495F;
  --ink-3: #868097;
  --paper: #FFFFFF;
  --paper-2: #F4F3F7;
  --paper-3: #E9E7EF;
  --line: #DDDAE5;
  --ground: #C7D3DB;
  --scrim: rgba(18, 15, 28, 0.5);
  --label: #D9473C;
  --label-dk: #B23429;
  --gold: #E2A72C;
  --gold-dk: #A97A10;
  --creative: #3B78DD;
  --tech: #E8851C;
  --flaw: #D2404A;
  --spark: #F0C133;
  --good: #2A9A62;
  --good-dk: #1E7A4B;
  --violet: #6550D2;
  --warn: #E8851C;
  --shadow: 0 1px 2px rgba(18, 15, 28, 0.10), 0 3px 10px rgba(18, 15, 28, 0.06);
  --shadow-lg: 0 2px 6px rgba(18, 15, 28, 0.10), 0 18px 44px rgba(18, 15, 28, 0.22);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --r-lg: 14px;
  --r-md: 10px;
  --r-sm: 7px;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.45;
  font-weight: 500;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
input, textarea { user-select: text; -webkit-user-select: text; }
#app { position: fixed; inset: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; display: block; cursor: pointer; touch-action: manipulation; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px; }
.ico-lg { width: 22px; height: 22px; }

/* ---------- HUD ---------- */
.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 6px;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  padding: 5px 12px; box-shadow: var(--shadow); font-weight: 700; white-space: nowrap; min-height: 40px;
}
.brand { gap: 10px; max-width: 34vw; }
.brand .disc { width: 26px; height: 26px; border-radius: 50%; flex: none; background: repeating-radial-gradient(circle, #3A3155 0 1.5px, #2B2140 1.5px 3px); position: relative; }
.brand .disc::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--label); box-shadow: 0 0 0 2px #2B2140 inset; }
.brand .lname { overflow: hidden; text-overflow: ellipsis; font-weight: 800; font-stretch: 112%; }
.brand .tier { color: var(--ink-3); font-size: 12px; font-weight: 700; }
.hud .spacer { flex: 1; }
.clock { gap: 4px; padding: 4px 6px 4px 14px; }
.clock .date { min-width: 92px; font-weight: 800; font-stretch: 112%; }
.clock .date small { display: block; font-size: 11px; color: var(--ink-3); font-weight: 700; line-height: 1; margin-top: 1px; }
.speed { width: 32px; height: 30px; border-radius: 8px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.speed:hover { background: var(--paper-2); }
.speed.on { background: var(--ink); color: var(--paper); }
.speed.paused-on { background: var(--label); color: var(--paper); }
.stat { gap: 6px; padding: 5px 12px; cursor: default; }
.stat .v { font-weight: 800; font-stretch: 112%; }
.stat.cash .v { color: var(--ink); }
.stat.cash.neg .v { color: var(--flaw); }
.stat .ico { color: var(--ink-3); }
.stat.insp .ico { color: var(--gold-dk); }
.stat.pulse { animation: pulse 0.35s ease-out; }
.iconbtn { width: 40px; height: 40px; padding: 0; justify-content: center; cursor: pointer; }
.iconbtn:hover { background: var(--paper-2); }
.floatmoney { position: fixed; z-index: 25; font-weight: 900; color: var(--good-dk); pointer-events: none; animation: floatup 1.6s ease-out forwards; text-shadow: 0 2px 0 #fff; }
.floatmoney.neg { color: var(--flaw); }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }

/* ---------- project panel ---------- */
.proj {
  position: fixed; z-index: 15; left: 50%; transform: translateX(-50%);
  top: calc(64px + env(safe-area-inset-top, 0px));
  width: min(620px, calc(100% - 32px));
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow); padding: 8px 10px; display: grid; gap: 6px;
}
.proj-bottom { display: flex; gap: 8px; align-items: center; }
.proj-bottom .stages { flex: 1; min-width: 0; }
.proj .hype { border: 0; background: var(--paper-2); border-radius: 8px; height: 24px; padding: 0 8px; cursor: pointer; }
.proj .hype:hover { background: var(--paper-3); }
.proj .hypebar { width: 54px; height: 7px; }
.proj-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.proj-cover { width: 44px; height: 44px; border-radius: 8px; flex: none; position: relative; overflow: visible; margin-right: 16px; }
.proj-cover img { width: 44px; height: 44px; border-radius: 8px; display: block; position: relative; z-index: 1; }
.proj-cover .vin { position: absolute; top: 3px; left: 12px; width: 38px; height: 38px; border-radius: 50%; background: repeating-radial-gradient(circle, #3A3155 0 1.5px, #2B2140 1.5px 3px); }
.proj.spin .proj-cover .vin { animation: slidevinyl 0.6s ease-out forwards, spin 2.2s linear infinite; }
@keyframes slidevinyl { to { left: 22px; } }
@keyframes spin { to { transform: rotate(360deg); } }
.proj-info { flex: 1; min-width: 0; }
.proj-title { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
.proj-sub { color: var(--ink-2); font-size: 13px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.counters { display: flex; gap: 6px; }
.counter { min-width: 56px; border-radius: 8px; padding: 3px 8px; text-align: center; color: #fff; font-weight: 800; font-stretch: 112%; font-size: 17px; line-height: 1.1; }
.counter small { display: block; font-size: 10px; font-weight: 800; opacity: 0.9; letter-spacing: 0.02em; }
.counter.c { background: var(--creative); }
.counter.t { background: var(--tech); }
.counter.f { background: var(--flaw); }
.counter.pulse { animation: pulse 0.3s ease-out; }
.counter.req { background: var(--paper-2); color: var(--ink); border: 1px solid var(--line); }
.counter.req.done { background: var(--good); color: #fff; border-color: var(--good); }
.stages { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.stg { height: 24px; white-space: nowrap; border-radius: 6px; background: var(--paper-2); position: relative; overflow: hidden; font-size: 12px; font-weight: 800; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 4px; }
.stg .fill { position: absolute; inset: 0 auto 0 0; background: var(--violet); opacity: 0.18; width: 0; }
.stg.done { background: var(--violet); color: #fff; }
.stg.now { color: var(--ink); box-shadow: inset 0 0 0 2px var(--violet); }
.stg span { position: relative; }
.proj-actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hype { font-size: 12px; font-weight: 800; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.hypebar { width: 90px; height: 8px; border-radius: 99px; background: var(--paper-3); overflow: hidden; }
.hypebar i { display: block; height: 100%; background: linear-gradient(90deg, var(--label), var(--gold)); }

/* ---------- sales panel ---------- */
.sales {
  position: fixed; z-index: 14; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: 290px; max-width: calc(100% - 32px); display: grid; gap: 6px;
}
.sale {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow);
  padding: 8px 10px; display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; cursor: pointer;
}
.sale img { width: 40px; height: 40px; border-radius: 6px; display: block; }
.sale .t { font-weight: 900; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sale .s { font-size: 12px; color: var(--ink-2); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sale > div { min-width: 0; }
.chartpos { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 20px; line-height: 1; text-align: right; color: var(--ink); }
.chartpos small { display: block; font-family: var(--font-ui); font-size: 10px; font-weight: 800; color: var(--ink-3); }
.chartpos.top10 { color: var(--label); }
.chartpos.no1 { color: var(--gold-dk); }
.mv-up { color: var(--good-dk); }
.mv-down { color: var(--flaw); }
.sales-head { font-size: 12px; font-weight: 900; color: var(--ink-2); display: flex; justify-content: space-between; padding: 0 4px; }

/* ---------- action dock (bottom centre) ---------- */
:root { --dock-h: 74px; }
.dock {
  position: fixed; z-index: 16; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: stretch; gap: 2px; padding: 6px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg);
  max-width: calc(100% - 24px);
}
.dk { position: relative; border: 0; background: transparent; width: 64px; padding: 6px 2px 7px; border-radius: 11px; display: grid; justify-items: center; align-content: start; gap: 4px; cursor: pointer; color: var(--ink-2); }
.dk:hover { background: var(--paper-2); }
.dk-ico { position: relative; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--c); color: #fff; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.16); }
.dk-ico .ico { width: 20px; height: 20px; }
.dk-lbl { font-size: 11.5px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
.dk-badge { position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--gold); color: var(--ink); font-size: 10.5px; font-weight: 900; line-height: 14px; text-align: center; border: 2px solid var(--paper); }
.dk.off { cursor: help; }
.dk.off .dk-ico { background: var(--paper-3); color: var(--ink-3); box-shadow: none; }
.dk.off .dk-lbl { color: var(--ink-3); }
.dk.main { width: 104px; background: var(--label); color: #fff; margin-right: 4px; }
.dk.main:hover { background: var(--label-dk); }
.dk.main .dk-ico { background: rgba(255, 255, 255, 0.16); box-shadow: none; }
.dk.main .dk-lbl { color: #fff; font-size: 12.5px; }
.dk.main.off { background: var(--paper-2); }
.dk.main.off .dk-ico { background: var(--paper-3); color: var(--ink-2); }
.dk.main.off .dk-lbl { color: var(--ink-2); }
.dk.main.pulse::after { content: ''; position: absolute; inset: -3px; border-radius: 14px; border: 2px solid var(--label); animation: dkpulse 1.9s ease-out infinite; pointer-events: none; }
@keyframes dkpulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.1, 1.22); } }
.dk-prog { position: absolute; left: 12px; right: 12px; bottom: 3px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.dk-prog i { display: block; height: 100%; background: var(--label); transition: width 0.4s; }
.dk-sep { width: 1px; background: var(--line); margin: 8px 3px; flex: none; }
.dk.spot { animation: dkspot 0.6s ease-in-out 8 alternate; }
.dk.spot::before { content: 'Here'; position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 8px; white-space: nowrap; pointer-events: none; box-shadow: var(--shadow); }
@keyframes dkspot { from { transform: translateY(0); box-shadow: 0 0 0 0 rgba(226, 167, 44, 0); } to { transform: translateY(-5px); box-shadow: 0 0 0 4px rgba(226, 167, 44, 0.6); } }
.mi.spot { animation: mispot 0.6s ease-in-out 8 alternate; }
@keyframes mispot { from { box-shadow: 0 0 0 0 rgba(226, 167, 44, 0); } to { box-shadow: 0 0 0 3px rgba(226, 167, 44, 0.95); } }

/* ---------- goal tracker (top left) ---------- */
.goal {
  position: fixed; z-index: 14; left: 12px; top: calc(70px + env(safe-area-inset-top, 0px));
  width: 300px; max-width: calc(100% - 24px); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow);
  padding: 10px 12px; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center;
}
.goal { cursor: pointer; }
.goal-tog { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.goal-tog:hover { background: var(--paper-2); }
.goal-tog .ico { width: 16px; height: 16px; transition: transform 0.2s; }
.goal-tog[aria-expanded="true"] .ico { transform: rotate(180deg); }
.goal-how { grid-column: 1 / -1; display: grid; gap: 8px; justify-items: start; border-top: 1px solid var(--line); padding-top: 8px; }
.goal-how p { font-size: 12.5px; font-weight: 600; color: var(--ink-2); line-height: 1.4; }
.goal-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--ink); color: var(--gold); display: grid; place-items: center; }
.goal-txt { min-width: 0; display: grid; gap: 3px; }
.goal-txt small { font-size: 11px; font-weight: 800; color: var(--ink-3); }
.goal-txt b { font-size: 13.5px; font-weight: 800; line-height: 1.2; }
.goal-bar { height: 6px; border-radius: 6px; background: var(--paper-3); overflow: hidden; margin-top: 2px; }
.goal-bar i { display: block; height: 100%; background: var(--gold); transition: width 0.5s; }
.goal-meta { display: flex; gap: 8px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); flex-wrap: wrap; }
.goal-meta:empty { display: none; }
.goal.done { animation: goaldone 0.9s ease-out; }
@keyframes goaldone { 0% { box-shadow: 0 0 0 0 rgba(42, 154, 98, 0.6); } 100% { box-shadow: 0 0 0 14px rgba(42, 154, 98, 0); } }

/* ---------- notes & toasts ---------- */
.notes {
  position: fixed; z-index: 30; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100% - 32px)); display: grid; gap: 8px;
}
.note {
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; animation: noteIn 0.28s ease-out;
}
@keyframes noteIn { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
.note .nicon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--violet); }
.note.k-tip .nicon { background: var(--gold); color: var(--ink); }
.note.k-news .nicon { background: var(--ink); }
.note.k-success .nicon, .note.k-celebrate .nicon { background: var(--good); }
.note.k-warn .nicon { background: var(--label); }
.note.k-awards .nicon { background: var(--gold); color: var(--ink); }
.note h3 { font-size: 16px; font-weight: 800; }
.note p { color: var(--ink-2); font-weight: 500; margin-top: 2px; }
.note .nbtns { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.note .more { font-size: 12px; font-weight: 800; color: var(--ink-3); }
.note-kicker { font-size: 12px; font-weight: 800; color: var(--ink-3); }
.toasts { position: fixed; z-index: 31; left: 12px; top: calc(var(--goal-b, 70px) + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; justify-items: start; pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); border-radius: 10px; padding: 7px 14px; font-weight: 700; font-size: 13px; box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; animation: toastIn 0.25s ease-out, toastOut 0.4s ease-in 3.6s forwards; max-width: min(360px, calc(100vw - 32px)); }
.toast.success { background: var(--good-dk); }
.toast.warn { background: var(--label-dk); }
.toast.gold { background: var(--gold); color: var(--ink); }
@keyframes toastIn { from { transform: translateX(-20px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-6px); } }

/* ---------- buttons, chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  border-radius: 9px; padding: 9px 16px; font-weight: 700; font-size: 15px; cursor: pointer;
  box-shadow: 0 1px 2px rgba(18, 15, 28, 0.08); transition: transform 0.06s, box-shadow 0.06s, background 0.12s;
}
.btn:hover { background: var(--paper-2); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.primary { background: var(--label); color: #fff; border-color: var(--label-dk); box-shadow: 0 1px 2px rgba(178, 52, 41, 0.35); }
.btn.primary:hover { background: #C93F35; }
.btn.primary:active { box-shadow: none; }
.btn.gold { background: var(--gold); color: var(--ink); border-color: var(--gold-dk); box-shadow: 0 1px 2px rgba(169, 122, 16, 0.35); }
.btn.gold:hover { background: #D69C22; }
.btn.good { background: var(--good); color: #fff; border-color: var(--good-dk); box-shadow: 0 1px 2px rgba(30, 122, 75, 0.35); }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--paper-2); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn.lg { padding: 12px 22px; font-size: 16px; border-radius: 11px; }
.btn[disabled], .btn.dis { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary[disabled], .btn.gold[disabled] { opacity: 1; background: var(--paper-3); border-color: var(--paper-3); color: var(--ink-3); box-shadow: none; }
.btn.pulsing { animation: btnpulse 1.4s ease-in-out infinite; }
@keyframes btnpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217, 71, 60, 0.45); } 50% { box-shadow: 0 0 0 8px rgba(217, 71, 60, 0); } }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper);
  border-radius: 8px; padding: 5px 11px; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--ink);
}
.chip:hover { border-color: var(--ink-3); }
.chip.sel { background: var(--c, var(--ink)); border-color: var(--c, var(--ink)); color: #fff; }
.chip.dis { opacity: 0.4; cursor: not-allowed; }
.chip .mk { font-size: 11px; font-weight: 900; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--paper-3); color: var(--ink-2); white-space: nowrap; }
.progress { height: 10px; border-radius: 999px; background: var(--paper-3); overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: inherit; }
.act { flex: none; display: flex; justify-content: flex-end; }
.why { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 12px; font-weight: 800; color: #A2560B; }
.why svg { width: 13px; height: 13px; flex: none; }
.tag.trait { background: #EFE9FF; color: #5B45D6; }
.trait-desc { font-size: 11.5px; font-weight: 700; color: var(--ink-3); margin-top: 4px; line-height: 1.3; }
.tag.key { background: #FFE3E3; color: var(--label-dk); }
.tag.useful { background: #E3EDFF; color: #2F64C9; }
.tag.minor { background: var(--paper-3); color: var(--ink-3); }
.tag.hot { background: #FFF0D6; color: #B4690E; }
.tag.great { background: #FFF3C8; color: #9A6B00; }
.tag.good { background: #E1F7EA; color: var(--good-dk); }
.tag.ok { background: var(--paper-3); color: var(--ink-2); }
.tag.bad { background: #FFE3E3; color: var(--label-dk); }
.gchip { --c: var(--ink); }
.gchip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.gchip.sel .dot { background: #fff; }

/* ---------- context menu ---------- */
.menu {
  position: fixed; z-index: 40; width: 270px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: auto;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); padding: 8px;
  animation: menuIn 0.14s ease-out;
}
@keyframes menuIn { from { transform: scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
.menu-sec { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px 4px; }
.mi { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; font-weight: 700; text-align: left; cursor: pointer; }
.mi:hover { background: var(--paper-2); }
.mi .ico { color: var(--ink-2); }
.mi.hl { background: var(--label); color: #fff; }
.mi.hl .ico { color: #fff; }
.mi.hl:hover { background: #C93F35; }
.mi .badge { margin-left: auto; background: var(--gold); color: var(--ink); border-radius: 999px; font-size: 11px; font-weight: 900; padding: 1px 7px; }
.mi .hint { margin-left: auto; font-size: 11px; color: var(--ink-3); font-weight: 700; }
.mi[disabled] { opacity: 0.45; cursor: not-allowed; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn 0.15s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--paper); border-radius: 16px; box-shadow: var(--shadow-lg); border: 1px solid var(--line);
  width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; animation: modalIn 0.22s cubic-bezier(.2, 1.3, .5, 1);
}
.modal.wide { width: min(940px, 100%); }
.modal.narrow { width: min(520px, 100%); }
@keyframes modalIn { from { transform: translateY(18px) scale(0.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--paper-3); }
.modal-head h2 { font-size: 21px; font-weight: 800; font-stretch: 115%; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.modal-head .sub { color: var(--ink-2); font-weight: 700; font-size: 13px; margin-top: 1px; }
.modal-head .x { width: 36px; height: 36px; border-radius: 9px; border: 0; background: var(--paper-2); cursor: pointer; display: grid; place-items: center; flex: none; }
.modal-head .x:hover { background: var(--paper-3); }
.modal-body { padding: 16px 18px; overflow: auto; display: grid; gap: 16px; align-content: start; }
.modal-foot { padding: 12px 18px 16px; border-top: 1px solid var(--paper-3); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.modal-foot .grow { flex: 1; min-width: 0; color: var(--ink-2); font-weight: 700; font-size: 14px; }
.sec-title { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.sec-title .aside { margin-left: auto; font-weight: 700; color: var(--ink-3); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.err { color: var(--label-dk); font-weight: 800; font-size: 13px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.field { display: flex; gap: 8px; align-items: center; }
.input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 9px 12px; font: inherit; font-weight: 700; color: var(--ink); background: var(--paper); }
.input:focus { outline: none; border-color: var(--violet); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .opt { flex: 1 1 110px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--paper); text-align: left; cursor: pointer; min-width: 0; display: grid; gap: 4px; align-content: start; }
.seg .opt .tpic { width: 40px; height: 32px; flex: none; margin-left: -2px; }
.seg .opt.dis .tpic { filter: grayscale(1); opacity: 0.7; }
.seg .opt .otx { min-width: 0; }
.nr-know { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.nr-know .small { display: grid; gap: 2px; color: var(--ink-2); }
.nr-know .small span { color: var(--ink-3); font-weight: 600; }
.seg .opt b { display: block; font-weight: 800; }
.seg .opt span { font-size: 12px; color: var(--ink-3); font-weight: 700; }
.seg .opt.sel { border-color: var(--label); background: #FBEDEB; box-shadow: inset 0 0 0 1px var(--label); }
.seg .opt.dis { opacity: 0.45; cursor: not-allowed; }
.list { display: grid; gap: 8px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--paper); display: grid; gap: 8px; }
.card.sel { border-color: var(--label); background: #FCF3F2; box-shadow: inset 0 0 0 1px var(--label); }
.card.click { cursor: pointer; }
.card.click:hover { border-color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; display: block; }
.avatar.sm { width: 38px; height: 38px; }
.avatar.lg { width: 84px; height: 84px; }
.name { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.bars { display: grid; gap: 4px; }
.sbar { display: grid; grid-template-columns: 74px 1fr 30px; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; color: var(--ink-2); }
.sbar .tr { height: 8px; border-radius: 99px; background: var(--paper-3); overflow: hidden; }
.sbar .tr i { display: block; height: 100%; border-radius: 99px; background: var(--violet); }
.sbar .val { text-align: right; color: var(--ink); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.kv > div { background: var(--paper-2); border-radius: 10px; padding: 8px 10px; }
.kv b { display: block; font-size: 18px; font-weight: 800; font-stretch: 112%; }
.kv span { font-size: 12px; color: var(--ink-2); font-weight: 700; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 0; background: var(--paper-2); border-radius: 8px; padding: 7px 14px; font-weight: 800; cursor: pointer; color: var(--ink-2); }
.tab.on { background: var(--ink); color: var(--paper); }
.empty { padding: 18px; text-align: center; color: var(--ink-2); background: var(--paper-2); border-radius: 12px; font-weight: 700; }

/* stage focus: segmented effort bars + time-split donut (Game Dev Tycoon style) */
.hint-card { background: #FBF5E6; border-color: #EBDDB6; }
.stage-grid { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 18px; align-items: start; }
.donut-wrap { display: grid; gap: 12px; justify-items: center; background: var(--paper-2); border-radius: 12px; padding: 14px 12px; }
.donut { width: 128px; height: 128px; display: block; }
.legend { display: grid; gap: 4px; width: 100%; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.legend .li { display: flex; align-items: center; gap: 7px; }
.legend .li i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.legend .li span { margin-left: auto; color: var(--ink); font-weight: 800; }
.genre-know { width: 100%; display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; }
.gk-head { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; color: var(--ink); }
.gk-head .dot { width: 10px; height: 10px; border-radius: 50%; }
.kgrid { display: grid; gap: 4px; }
.krow { display: grid; grid-template-columns: 1fr repeat(3, 22px); gap: 4px; align-items: center; color: var(--ink-3); font-weight: 700; font-size: 11px; }
.kd { height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; color: #fff; }
.kd.key { background: var(--label); }
.kd.useful { background: var(--creative); }
.kd.minor { background: #A9A4B6; }
.kd.unk { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.kfoot { color: var(--ink-3); font-weight: 700; font-size: 11px; text-align: right; }
.gk-ratio, .gk-last { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink-2); line-height: 1.3; }
.gk-ratio .ico { width: 15px; height: 15px; color: var(--violet); }
.gk-ratio.unk { color: var(--ink-3); }
.gk-last { display: block; }
.ok-good { color: var(--good-dk); } .ok-fine { color: var(--creative); } .ok-bad { color: var(--flaw); }
.focus-list { display: grid; gap: 10px; min-width: 0; }
.focus-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 52px; gap: 6px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.focus-row .aico { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; background: var(--paper-2); color: var(--c); grid-row: span 3; align-self: start; }
@supports (background: color-mix(in srgb, red 10%, white)) { .focus-row .aico { background: color-mix(in srgb, var(--c) 13%, white); } }
.focus-row .aico .ico { width: 24px; height: 24px; }
.focus-row .lbl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.focus-row .lbl b { font-weight: 800; font-size: 15px; }
.focus-row .pct { text-align: right; font-weight: 800; font-stretch: 118%; font-size: 19px; color: var(--ink); }
.focus-row .desc { grid-column: 2 / -1; font-size: 12px; color: var(--ink-3); font-weight: 500; }
.segbar { grid-column: 2 / -1; position: relative; display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 30px; padding-top: 8px; cursor: pointer; touch-action: none; border-radius: 6px; }
.segbar:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }
.segbar .sg { border-radius: 4px; background: var(--paper-3); transition: background 0.08s; box-shadow: inset 0 -2px 0 rgba(18, 15, 28, 0.06); }
.segbar .sg.on { background: var(--c); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.16); }
.segbar:hover .sg:not(.on) { background: #DFDCE7; }
.segbar .target { position: absolute; top: -1px; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--ink); transform: translateX(-50%); pointer-events: none; }
.imp { display: inline-flex; align-items: flex-end; gap: 2px; font-size: 11px; font-weight: 700; color: var(--ink-2); padding: 2px 7px 2px 6px; border-radius: 6px; background: var(--paper-2); }
.imp i { width: 3px; border-radius: 1px; background: #CFCBD9; }
.imp i:nth-of-type(1) { height: 5px; } .imp i:nth-of-type(2) { height: 8px; } .imp i:nth-of-type(3) { height: 11px; margin-right: 4px; }
.imp.key i.on { background: var(--label); } .imp.key { color: var(--label-dk); background: #FBEAE8; }
.imp.useful i.on { background: var(--creative); } .imp.useful { color: #2C5DB0; background: #E8F0FC; }
.imp.minor i.on { background: #8F899F; }
.imp.unknown { color: var(--ink-3); background: transparent; box-shadow: inset 0 0 0 1px var(--line); align-items: center; }
@media (max-width: 640px) {
  .stage-grid { grid-template-columns: 1fr; }
  .donut-wrap { grid-template-columns: 96px 1fr; justify-items: stretch; align-items: center; }
  .donut { width: 96px; height: 96px; }
  .genre-know { grid-column: 1 / -1; }
  .focus-row { grid-template-columns: 36px minmax(0, 1fr) 44px; padding: 10px; }
  .focus-row .aico { width: 36px; height: 36px; }
}

/* sliders */
.slrow { display: grid; grid-template-columns: minmax(0, 1fr) 54px; gap: 4px 12px; align-items: center; }
.slrow .lbl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.slrow .lbl b { font-weight: 900; }
.slrow .desc { grid-column: 1 / -1; font-size: 12px; color: var(--ink-3); font-weight: 700; margin-top: -4px; }
.slrow .pct { text-align: right; font-weight: 900; color: var(--ink-2); }
input[type=range].rng { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; width: 100%; height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--fill, var(--violet)) var(--p, 50%), var(--paper-3) var(--p, 50%)); outline-offset: 4px; }
input[type=range].rng::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); box-shadow: 0 2px 0 rgba(43, 33, 64, .2); cursor: grab; }
input[type=range].rng::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); cursor: grab; }

/* reviews: critics reveal one at a time */
.rv-status { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink-2); min-height: 22px; }
.rv-dots { display: inline-flex; gap: 4px; }
.rv-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--label); animation: rvdot 1s ease-in-out infinite; }
.rv-dots i:nth-child(2) { animation-delay: 0.15s; } .rv-dots i:nth-child(3) { animation-delay: 0.3s; }
.rv-status.done .rv-dots { display: none; }
@keyframes rvdot { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.reviews { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.critic { border-radius: 12px; background: var(--paper-2); padding: 12px; display: grid; gap: 6px; align-content: start; min-height: 150px; border: 1px solid transparent; transition: background 0.3s, transform 0.3s, box-shadow 0.3s; }
.critic.wait { background: repeating-linear-gradient(135deg, var(--paper-2) 0 10px, #EFEDF4 10px 20px); }
.critic.wait .sc span { color: var(--ink-3); }
.critic.active { box-shadow: 0 0 0 2px var(--c), 0 6px 18px rgba(18, 15, 28, 0.12); transform: translateY(-3px); animation: critpulse 0.9s ease-in-out infinite; }
@keyframes critpulse { 50% { box-shadow: 0 0 0 4px var(--c), 0 6px 18px rgba(18, 15, 28, 0.12); } }
.critic .pen { font-size: 12px; font-weight: 700; color: var(--ink-3); font-style: italic; }
.critic.in { background: var(--paper); border-color: var(--line); animation: critin 0.35s ease-out; }
.critic.in.rave { background: #FBF4E2; border-color: #EBD8A6; }
.critic.in.pan { background: #FBEFEE; border-color: #EDCFCB; }
@keyframes critin { from { transform: rotateX(70deg); opacity: 0.4; } to { transform: none; opacity: 1; } }
.critic .cn { font-size: 12px; font-weight: 900; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.critic .cn i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.critic .sc { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 40px; line-height: 1; color: var(--c); }
.critic .sc small { font-family: var(--font-ui); font-weight: 900; font-size: 14px; color: var(--ink-3); }
.critic q { font-weight: 700; color: var(--ink); font-size: 13px; quotes: "\201C" "\201D"; }
.verdict { display: flex; align-items: center; gap: 16px; background: transparent; color: var(--ink-3); border: 2px dashed var(--line); border-radius: 12px; padding: 12px 16px; min-height: 82px; transition: background 0.3s, border-color 0.3s; }
.verdict:not(.in) .big { color: var(--line); }
.verdict:not(.in) span { color: var(--ink-3); }
.verdict.in { background: var(--ink); color: var(--paper); border-color: var(--ink); animation: verdictin 0.5s cubic-bezier(.2, 1.3, .5, 1); }
.verdict.in.pan .big { color: #F08A82; }
@keyframes verdictin { from { transform: scale(0.94); } to { transform: none; } }
.verdict .big { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; font-size: 46px; line-height: 1; color: var(--gold); }
.verdict b { font-size: 18px; font-weight: 900; display: block; }
.verdict span { color: #CFC8E6; font-weight: 700; font-size: 13px; }

/* stamps & overlays */
.stamp { position: fixed; z-index: 60; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-6deg); font-family: var(--font-display); font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: 0.02em; font-size: clamp(36px, 7.5vw, 84px); color: var(--gold); text-shadow: 0 4px 0 var(--ink); -webkit-text-stroke: 2px var(--ink); pointer-events: none; animation: stamp 2.4s ease-out forwards; white-space: nowrap; }
@keyframes stamp { 0% { transform: translate(-50%, -50%) rotate(-6deg) scale(2.2); opacity: 0; } 12% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -54%) rotate(-6deg) scale(1); } }

/* title screen */
.title {
  position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: radial-gradient(circle at 50% 45%, rgba(199, 211, 219, 0.55), rgba(199, 211, 219, 0.94) 70%);
}
.title-inner { display: grid; justify-items: center; gap: 22px; text-align: center; max-width: 560px; }
.bigdisc { width: min(300px, 64vw); aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative; background: repeating-radial-gradient(circle, #3A3155 0 2px, #2B2140 2px 4px); box-shadow: 0 10px 0 rgba(43, 33, 64, .25), 0 30px 60px rgba(43, 33, 64, .25); display: grid; place-items: center; }
.bigdisc::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 40deg, rgba(255,255,255,.14) 50deg, transparent 60deg 220deg, rgba(255,255,255,.1) 230deg, transparent 240deg); animation: spin 6s linear infinite; }
.bigdisc .lab { width: 54%; aspect-ratio: 1; border-radius: 50%; background: var(--label); display: grid; place-items: center; position: relative; box-shadow: inset 0 0 0 4px #C23E34, inset 0 0 0 9px var(--label), inset 0 0 0 10px rgba(255,255,255,0.35); }
.bigdisc .lab::after { content: ""; position: absolute; width: 9%; aspect-ratio: 1; border-radius: 50%; background: var(--ground); }
.logo { font-family: var(--font-display); font-stretch: 125%; font-weight: 900; text-transform: uppercase; letter-spacing: 0.03em; color: #fff; font-size: clamp(13px, 3.2vw, 20px); line-height: 1.02; display: grid; justify-items: center; gap: clamp(22px, 5.5vw, 34px); text-align: center; }
.title h1 { font-family: var(--font-display); font-stretch: 125%; font-size: clamp(30px, 6vw, 52px); line-height: 1; color: var(--ink); font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; }
.title p.lead { font-weight: 500; color: var(--ink-2); font-size: 16px; max-width: 42ch; }
.title .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.title .foot { font-size: 12px; color: var(--ink-3); font-weight: 700; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer; padding: 0; }
.sw.sel { box-shadow: 0 0 0 3px var(--ink); }
.lookgrid { display: grid; grid-template-columns: 110px 1fr; gap: 16px; align-items: start; }

/* misc */
.chartlist { display: grid; gap: 4px; }
.cl { display: grid; grid-template-columns: 30px 26px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; }
.cl:nth-child(odd) { background: var(--paper-2); }
.cl.ours { background: #FBF1DA; box-shadow: inset 0 0 0 1.5px var(--gold); }
.cl .p { font-weight: 800; font-stretch: 115%; font-size: 16px; text-align: right; }
.cl > :nth-child(2) { text-align: center; }
.cl .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cl .tt b { font-weight: 900; color: var(--ink); }
.cl .lb { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; font-weight: 700; }
.table th { text-align: left; font-size: 11px; color: var(--ink-3); font-weight: 900; padding: 6px 8px; border-bottom: 2px solid var(--paper-3); white-space: nowrap; }
.table td { padding: 7px 8px; border-bottom: 1px solid var(--paper-3); vertical-align: middle; }
.table tr.click { cursor: pointer; }
.table tr.click:hover td { background: var(--paper-2); }
.tscroll { overflow-x: auto; }
.scorebadge { display: inline-grid; place-items: center; min-width: 34px; height: 26px; border-radius: 8px; font-weight: 900; color: #fff; padding: 0 6px; }
.chart-svg { width: 100%; height: auto; display: block; }
.bulb-cost { display: inline-flex; align-items: center; gap: 3px; font-weight: 900; }
.rcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.rcard.done { background: #F0FBF4; border-color: #BFE9D1; }
.rcard.locked { opacity: 0.55; }
.rcard h4 { font-size: 15px; font-weight: 800; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.award-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 10px; background: var(--paper-2); }

(function () {

// Utilities: math, random, curves, formatting, colors, dates

const TAU = Math.PI * 2;

// Small seedable RNG (mulberry32) whose state can be saved.

// Piecewise curve: points [[x, y], ...] sorted by x. Smooth interpolation, clamped ends.
function curveAt(points, x) {

  const last = points[points.length - 1];

  for (let i = 1; i < points.length; i++) {
    const [x1, y1] = points[i];
    if (x <= x1) {

      const t = (x - x0) / (x1 - x0 || 1);

// ============================================================
// Simulation core: state, event bus, generators, market model
// ============================================================
let S = null;            // the whole game state (serializable)
let rng = new RNG(Date.now() & 0xffffffff);
const SAVE_VERSION = 3;

const Bus = {
  l: {},
  on(e, f) { (this.l[e] || (this.l[e] = [])).push(f); },
  off(e, f) { const fs = this.l[e]; if (fs) this.l[e] = fs.filter((x) => x !== f); },
  emit(e, d) {
    const fs = this.l[e];
    if (!fs) return;
    for (const f of fs) { try { f(d); } catch (err) { console.error('[bus]', e, err); } }
  },
};

// Transient (not saved) sim-side data
const Tx = {
  acc: {},          // per-worker visual accumulators for bubbles
  bubbles: [],      // queued bubble spawns for the renderer
  charts: { singles: [], albums: [] },
  lastChart: { singles: [], albums: [] },
  headless: false,
};

// ---------- helpers ----------
function curYear() { return START_YEAR + Math.floor(S.week / WPY); }
function curYearF() { return yearFrac(S.t); }
function infl(y) { if (y == null) y = curYear(); return Math.pow(1.022, Math.max(0, y - START_YEAR)); }
function officeDef(level) { return OFFICES[(level || S.office) - 1]; }
function hasR(id) { return !!S.research[id]; }
function getArtist(id) { return S.artists.find((a) => a.id === id) || S.alumni.find((a) => a.id === id) || null; }
function getStaff(id) { return id === 'you' ? S.you : S.staff.find((x) => x.id === id) || null; }
function rosterMax() { return officeDef().roster; }
function staffMax() { return officeDef().staffMax; }
function workers() {
  const list = [S.you, ...S.staff];
  return list.filter((w) => w.status === 'work');
}
function ledger(kind, cat, amount) {
  const y = curYear();
  const L = S.ledger[y] || (S.ledger[y] = { inc: {}, exp: {} });
  L[kind][cat] = (L[kind][cat] || 0) + amount;
}
function earn(cat, amount) {
  if (!(amount > 0)) return;
  S.cash += amount;
  S.stats.earned += amount;
  ledger('inc', cat, amount);
}
function spend(cat, amount) {
  if (!(amount > 0)) return;
  S.cash -= amount;
  ledger('exp', cat, amount);
}
function canAfford(amount) { return S.cash >= amount; }
// Fans saturate: the closer to the cap, the harder it is to win more.
const LABEL_FAN_CAP = 60e6, ARTIST_FAN_CAP = 40e6;
function addLabelFans(n) {
  if (n > 0) n *= Math.max(0, 1 - S.fans / LABEL_FAN_CAP);
  S.fans = Math.max(0, Math.round(S.fans + n));
}
function addArtistFans(a, n) {
  if (!a) return;
  if (n > 0) n *= Math.max(0, 1 - a.fans / ARTIST_FAN_CAP);
  a.fans = Math.max(0, Math.round(a.fans + n));
}
function boostLabelFans(pct) { addLabelFans(S.fans * pct); }
function boostArtistFans(a, pct) { if (a) addArtistFans(a, a.fans * pct); }

// ---------- notifications ----------
// Notes are persisted so that decisions survive save/load.
function notify(n) {
  const note = Object.assign({ id: uid('n'), kind: 'info', week: S.week, pause: false }, n);
  S.notes.push(note);
  Bus.emit('note', note);
  return note;
}
function toast(text, kind = 'info', icon) { Bus.emit('toast', { text, kind, icon }); }
function tip(id) {
  if (!S || S.tipsOff || S.tips[id]) return;
  const t = TIPS[id];
  if (!t) return;
  S.tips[id] = 1;
  // a shortcut to the screen the tip talks about, only when that screen can open right now
  const SHOW = { research: ['Open Research', () => true], contracts: ['See contract offers', () => !busyReason()], scout: ['Scout talent', () => S.artists.length < rosterMax()], office: ['Open Office', () => true], staff: ['Open Staff', () => S.office >= 2], marketing: ['Open Marketing', () => !!S.project || S.hypeBank < HYPE_MAX] };
  const sh = t.show && SHOW[t.show] && SHOW[t.show][1]() ? SHOW[t.show] : null;
  notify({ kind: 'tip', title: t.title, text: t.text, pause: true, icon: 'bulb', choices: sh ? [{ label: 'Got it' }, { label: sh[0], style: 'primary', action: 'openPanel', args: t.show }] : undefined });
}

// ---------- names ----------
function pickFresh(gen, tries = 12) {
  let name = gen();
  for (let i = 0; i < tries && S && S.usedNames.includes(name); i++) name = gen();
  if (S) { S.usedNames.push(name); if (S.usedNames.length > 600) S.usedNames.splice(0, 100); }
  return name;
}
function personName(r = rng) { return r.pick(FIRST_NAMES) + ' ' + r.pick(LAST_NAMES); }
function artistNameFor(genre, kind, r = rng) {
  const F = () => r.pick(FIRST_NAMES), L = () => r.pick(LAST_NAMES);
  const A = () => r.pick(BAND_ADJ), N = () => r.pick(BAND_NOUN);
  switch (kind) {
    case 'band':
      if (genre === 'reggae') return `${F()} & the ${r.pick(REGGAE_NOUN)}`;
      if (genre === 'latin') return r.pick(LATIN_BANDS);
      if (genre === 'jazz') return `The ${L()} ${r.pick(JAZZ_SUFFIX)}`;
      return r.chance(0.6) ? `The ${A()} ${N()}` : (r.chance(0.5) ? `${A()} ${N()}` : `${F()} and the ${N()}`);
    case 'duo': return r.chance(0.5) ? `${F()} & ${F()}` : `${L()} & ${L()}`;
    case 'group':
      if (genre === 'kpop') return r.pick(KPOP_NAMES);
      return r.chance(0.5) ? `The ${A()} ${N()}` : `${A()} ${r.pick(['Sisters', 'Brothers', 'Heat', 'Society', 'Machine', 'Revue'])}`;
    case 'rapper': return `${r.pick(RAP_PRE)} ${r.pick(RAP_WORD)}`;
    case 'dj': return r.chance(0.6) ? r.pick(EDM_NAMES) : `DJ ${r.pick(RAP_WORD)}`;
    default:
      if (genre === 'latin') return `${r.pick(LATIN_FIRST)} ${r.pick(LATIN_LAST)}`;
      if (genre === 'kpop') return r.pick(['LUNA', 'HANA', 'YUNA', 'MINJI', 'SORA', 'JIWON', 'TAEO', 'HARU']);
      return `${F()} ${L()}`;
  }
}
function artistKindFor(genre, r = rng) {
  const roll = r.next();
  switch (genre) {
    case 'rock': case 'punk': case 'metal': case 'alternative': return roll < 0.7 ? 'band' : 'solo';
    case 'folk': case 'country': return roll < 0.6 ? 'solo' : roll < 0.85 ? 'band' : 'duo';
    case 'pop': case 'rnb': return roll < 0.7 ? 'solo' : roll < 0.85 ? 'duo' : 'group';
    case 'disco': return roll < 0.5 ? 'solo' : 'group';
    case 'jazz': return roll < 0.4 ? 'solo' : 'band';
    case 'reggae': return roll < 0.5 ? 'solo' : 'band';
    case 'hiphop': return roll < 0.8 ? 'rapper' : 'group';
    case 'electronic': return 'dj';
    case 'latin': return roll < 0.6 ? 'solo' : 'band';
    case 'kpop': return roll < 0.85 ? 'group' : 'solo';
    default: return 'solo';
  }
}
const SINGLE_T = ['{w}', '{w}', '{w}', '{w} Tonight', 'Midnight {w}', '{w} Forever', 'My {w}', 'Hey, {w}', 'Sweet {w}', '{w} Again', 'Golden {w}', 'Little {w}', 'No More {w}', 'All About {w}', 'Electric {w}', 'Lost in {w}', 'One More {w}', '{w} (Baby)', 'Only {w}', 'Chasing {w}'];
const ALBUM_T = ['{w}', '{w}', '{w}', 'The {w} Sessions', '{w} & Other Stories', '{w}, Vol. 1', 'The {w} Tapes', '{w} Nights', '{w} Club'];
// Words that are phrases, verbs or adjectives only take templates that read well with anything.
const PHRASE_OK = new Set(['{w}', '{w} Tonight', '{w} Forever', '{w} (Baby)', '{w} Again', '{w}!', '{w} (Club Mix)', '{w} Freestyle', '{w} Blues', '{w} & Other Stories', '{w}, Vol. 1']);
const PHRASEY = /\b(It|Me|Up|Down|Your|Even|Out|Over|Again|Back|by|on)\b|^(No|All)\b|^(Move|Shake|Spin|Swipe|Believe|Remember|Climb|Celebrate|Free|Wild|Loud|Famous|Brighter|Empty|Alone|Nobody|Solitary|Teenage|Haunted|Broken|Somewhere|Together|Online|Viral|Trending|Electric|Forever|Sleepwalk|Starry)$/;
const GENRE_T = { jazz: ['{w} Blues'], folk: ['{w} Blues', 'Ballad of {w}'], country: ['{w} Blues', '{w} County'], rnb: ['{w} Groove'], punk: ['{w}!'], electronic: ['{w} (Club Mix)'], hiphop: ['{w} Freestyle'], disco: ['{w} Fever'], metal: ['{w} of Doom'] };
function genTitle(themeId, genreId, typeId, r = rng) {
  const t = THEME[themeId] || r.pick(THEMES);
  const w = r.pick(t.words);
  let pool = (typeId === 'single') ? SINGLE_T.slice() : ALBUM_T.slice();
  if (GENRE_T[genreId] && typeId === 'single') pool = pool.concat(GENRE_T[genreId], GENRE_T[genreId]);
  if (PHRASEY.test(w)) pool = pool.filter((x) => PHRASE_OK.has(x));
  let tpl = r.pick(pool);
  // avoid ugly doubles like "Midnight Midnight" or "Back Again Again"
  const fixed = tpl.replace('{w}', ' ').toLowerCase().split(/[^a-z]+/).filter((x) => x.length >= 2);
  const ww = w.toLowerCase().split(/[^a-z]+/);
  if (fixed.some((x) => ww.includes(x))) tpl = '{w}';
  return tpl.replace('{w}', w);
}
function genLabelName(r = rng) { return r.pick(LABEL_NAME_A) + ' ' + r.pick(LABEL_NAME_B); }

function remapLook(l) {
  if (!l || typeof l !== 'object') return;
  const si = SHIRTS_OLD.indexOf(l.shirt); if (si >= 0) l.shirt = SHIRTS[si];

const PANTS = ['#3A3155', '#2E4C7A', '#5B5272', '#6B4E3D', '#1F2933', '#7A7F8C'];
function genLook(r = rng, genre = null) {
  const look = {
    skin: r.pick(SKINS),
    hair: r.pick(HAIRS),
    hairColor: r.pick(HAIR_COLORS),
    shirt: r.pick(SHIRTS),
    pants: r.pick(PANTS),
    acc: r.chance(0.7) ? 'none' : r.pick(['glasses', 'shades', 'headphones', 'beanie', 'cap']),
    beard: r.chance(0.18),
  };
  if (genre === 'punk') { look.hair = r.chance(0.5) ? 'mohawk' : 'spiky'; if (r.chance(0.6)) look.hairColor = r.pick(DYED); }
  if (genre === 'metal') { look.hair = r.chance(0.7) ? 'long' : look.hair; look.hairColor = r.chance(0.6) ? '#1E1E28' : look.hairColor; if (r.chance(0.4)) look.acc = 'shades'; look.shirt = r.pick(['#1E1E28', '#3A3155', '#5E6475']); }
  if (genre === 'country' && r.chance(0.55)) look.acc = 'cowboy';
  if (genre === 'electronic' && r.chance(0.6)) look.acc = 'headphones';
  if (genre === 'jazz' && r.chance(0.45)) look.acc = 'fedora';
  if (genre === 'kpop' && r.chance(0.6)) look.hairColor = r.pick(DYED.concat(['#EDEDED', '#E8D18E']));
  if (genre === 'hiphop' && r.chance(0.4)) look.acc = r.pick(['cap', 'beanie', 'shades']);
  if (genre === 'disco' && r.chance(0.4)) look.shirt = r.pick(['#E9B21C', '#FF5FA2', '#9B7BFF', '#F4F1FB']);
  if (look.hair === 'bald') look.beard = r.chance(0.5);
  return look;
}

function staffRole(st) {
  if (st.trait === 'beatmaker') return 'Beat Maker';
  if (st.c > st.t + 12) return 'Songwriter';
  if (st.t > st.c + 12) return 'Sound Engineer';
  return 'Producer';
}
function staffSalary(st) {
  const avg = (st.c + st.t) / 2;
  return Math.round((600 + (st.c + st.t + st.r / 2) * 18 + Math.max(0, avg - 60) * 120) * infl() / 50) * 50;
}
function genStaff(tier, r = rng) {
  const T = HIRE_TIERS.find((x) => x.id === tier) || HIRE_TIERS[0];
  const sk = () => Math.round(r.range(T.lo, T.hi));
  const st = {
    id: uid('s'), name: pickFresh(() => personName(r)), look: genLook(r),
    c: sk(), t: sk(), r: Math.round(r.range(T.lo * 0.7, T.hi * 0.9)),
    spd: Math.round(r.range(0.88, 1.18) * 100) / 100,
    energy: 100, xp: 0, lvl: 1, status: 'work', until: 0,
    trait: r.chance(0.6) ? r.pick(STAFF_TRAITS).id : null,
    hired: S ? S.week : 0,

// ---------- per-worker output ----------
function workerOutput(w, ctx) {
  const energyF = 0.6 + 0.4 * w.energy / 100;
  let k = BASE_RATE * w.spd * energyF * gearMult();
  if (hasR('p_laptop')) k *= 1.1;
  const tr = w.trait, g = ctx.genre;
  if (tr === 'nightowl' && ctx.stage === 2) k *= 1.15;
  if (tr === 'perfectionist') k *= 0.9;
  if (tr === 'rockstar') k *= 1.2;
  if (tr === 'wordsmith' && ctx.stage === 0) k *= 1.2;
  if (g) {
    if (tr === 'hitmaker' && (g === 'pop' || g === 'rnb' || g === 'kpop')) k *= 1.15;
    if (tr === 'analog' && (g === 'rock' || g === 'jazz' || g === 'folk')) k *= 1.15;
    if (tr === 'analog' && (g === 'electronic' || g === 'hiphop')) k *= 0.9;
    if (tr === 'beatmaker' && (g === 'hiphop' || g === 'electronic')) k *= 1.15;
  }
  const c = k * ctx.cShare * (w.c / 50);
  const t = k * (1 - ctx.cShare) * (w.t / 50);
  let f = k * 0.12 * Math.max(0.15, 1.2 - w.t / 100);
  if (tr === 'perfectionist') f *= 0.6;
  if (hasR('p_digital')) f *= 0.85;
  if (hasR('p_ai')) f *= 0.65;
  let i = (0.25 + w.r / 160) * (hasR('t_retreat') ? 1.25 : 1) * (tr === 'tinkerer' ? 1.3 : 1);
  return { c, t, f, i };
}
function sliderShares(sl) {

  return [sl[0] / tot, sl[1] / tot, sl[2] / tot];
}

}

}

function projectStep(dt) {
  const p = S.project;
  if (!p || p.awaiting) return;
  const ws = workers();
  if (p.stage < 3) {

    const cShare = stageCShare(p.stage, sl);

    const quiet = S.soundproof && S.office === 1 ? 0.9 : 1;

      const o = workerOutput(w, ctx);
      const c = o.c * xm * dt, t = o.t * xm * dt, f = o.f * quiet * dt, i = o.i * dt;
      p.C += c; p.T += t; p.F += f; S.insp += i;

      w.xp += (c + t);

      flushVisual(w.id, { c: o.c * xm, t: o.t * xm, f: o.f });
    }

    if (a && p.stage === 1) {

    }
    p.st += dt;

// ---------- time ----------
function shouldHalt() {
  if (!S) return true;
  if (S.project && S.project.awaiting) return true;
  if (S.notes.some((n) => n.pause)) return true;
  if (S.gameOver) return true;
  return false;
}
function advance(dtWeeks) {
  if (!S || S.gameOver) return;
  let remaining = dtWeeks;
  let guard = 0;
  while (remaining > 1e-9 && guard++ < 10000) {
    if (shouldHalt()) return;
    const toNext = Math.floor(S.t + 1e-9) + 1 - S.t;
    const step = Math.min(remaining, 0.2, Math.max(1e-6, toNext));
    remaining -= step;
    projectStep(step);
    contractStep(step);
    idleStep(step);
    S.t += step;
    const wk = Math.floor(S.t + 1e-9);
    while (S.week < wk) { S.week++; weekly(); }
  }
}
function idleStep(dt) {
  if (S.project || S.contract) return;
  for (const w of workers()) {
    const i = (0.25 + w.r / 160) * 0.25 * dt * (hasR('t_retreat') ? 1.25 : 1);
    S.insp += i;
    addVisual(w.id, 'i', i);
    flushVisual(w.id, { i: 0.2 });
  }
}
const XP_FOR = (l) => Math.round(45 * Math.pow(l - 1, 1.8));
function levelChecks() {
  for (const w of [S.you, ...S.staff]) {
    while (w.xp >= XP_FOR(w.lvl + 1) && w.lvl < 30) {
      w.lvl++;
      w.c = Math.min(100, w.c + rng.int(2, 4));
      w.t = Math.min(100, w.t + rng.int(2, 4));
      w.r = Math.min(100, w.r + rng.int(1, 3));
      w.spd = Math.min(1.5, Math.round((w.spd + 0.01) * 100) / 100);
      if (!w.isPlayer) { w.role = staffRole(w); w.salary = Math.max(w.salary, Math.round(staffSalary(w) * 0.9 / 50) * 50); }
      Bus.emit('levelup', w);
      toast(`${w.isPlayer ? 'You' : w.name} reached level ${w.lvl}!`, 'success', 'star');
    }
  }
}

function weekly() {
  const d = dateOf(S.week);

    const a = getArtist(p.artistId);
    if (a) {
      const drain = PTYPES[p.type].energy[p.stage] * 1.5 * (a.trait === 'workhorse' ? 0.8 : 1);
      a.energy = clamp(a.energy - drain, 0, 100);
      if (a.energy < 22 && !p.burnWarned) {

// What the current team really produces in a week of contract work, split between creativity and sound.

}

// ---------- marketing ----------
function campaignCost(c) { return Math.round(c.cost * infl() / 100) * 100; }
function campaignStatus(c) {
  if (c.research && !hasR(c.research)) return { ok: false, reason: `Research ${RESEARCH_BY[c.research].name}` };
  if (c.level && S.office < c.level) return { ok: false, reason: `Needs the ${OFFICES[c.level - 1].name}` };
  if (c.needsFormat && !(S.project && S.project.formats.includes(c.needsFormat))) return { ok: false, reason: `Record must be on ${FORMAT[c.needsFormat].name}` };
  if (currentHype() >= HYPE_MAX - 0.5) return { ok: false, reason: 'Hype is maxed' };
  if (S.cash < campaignCost(c)) return { ok: false, reason: 'Not enough cash' };
  return { ok: true };
}
function currentHype() { return S.project ? S.project.hype : S.hypeBank; }
function runCampaign(id) {
  const c = CAMPAIGN[id];
  const st = campaignStatus(c);
  if (!st.ok) return { error: st.reason };
  spend('marketing', campaignCost(c));
  const cur = currentHype();
  const genre = S.project ? S.project.genre : null;
  let gain = c.hype * (genre && c.bonus.includes(genre) ? 1.3 : 1) * Math.max(0.15, 1 - cur / 250);
  gain = Math.round(gain);
  if (S.project) { S.project.hype = Math.min(HYPE_MAX, S.project.hype + gain); S.project.campaigns.push(id); }
  else S.hypeBank = Math.min(HYPE_MAX, S.hypeBank + gain);
  Bus.emit('hype');
  return { ok: true, gain };
}

// ---------- research ----------
function researchLevel(r) { return r.repeat ? (S.upgrades || 0) : 0; }
function researchInsp(r) { return r.repeat ? Math.round(r.insp * Math.pow(1 + researchLevel(r), 1.35)) : r.insp; }
function researchCash(r) {
  if (!r.cash) return 0;
  const lvl = researchLevel(r);
  return Math.round(r.cash * (1 + lvl) * infl() / 1000) * 1000;
}
function researchStatus(r) {
  if (r.repeat) { if (researchLevel(r) >= r.repeat) return { state: 'done' }; }
  else if (S.research[r.id]) return { state: 'done' };
  if (S.lab && S.lab.id === r.id) return { state: 'pending', reason: `${S.lab.left} week${S.lab.left === 1 ? '' : 's'} left` };
  const q = r.req || {};
  if (q.year && curYear() < q.year) return { state: 'locked', reason: `Available in ${q.year}` };
  if (q.level && S.office < q.level) return { state: 'locked', reason: `Needs the ${OFFICES[q.level - 1].name}` };
  if (q.research && !S.research[q.research]) return { state: 'locked', reason: `Needs ${RESEARCH_BY[q.research].name}` };
  if (q.releases && S.releases.length < q.releases) return { state: 'locked', reason: `Release ${q.releases} records first` };
  if (r.cat === 'lab' && S.lab) return { state: 'locked', reason: 'The Sound Lab is busy' };
  if (S.insp < researchInsp(r)) return { state: 'short', reason: 'Not enough inspiration' };
  if (S.cash < researchCash(r)) return { state: 'short', reason: 'Not enough cash' };

}
function doResearch(id, opt) {

  if (id === 'lab_signature' && !GENRE[opt]) return { error: 'Pick a genre' };
  S.insp -= researchInsp(r);
  spend('research', researchCash(r));
  if (r.repeat) {
    S.upgrades = (S.upgrades || 0) + 1;
    Bus.emit('research', r.id);
    toast(`Studio upgraded to level ${S.upgrades}`, 'success', 'flask');
    return { ok: true };
  }
  if (r.weeks) {
    S.lab = { id, left: r.weeks, total: r.weeks, opt };

}
function completeResearch(r, opt) {

  if (r.id === 'lab_signature') S.signature = opt;
  if (r.id === 'lab_festival') S.festival = true;
  if (r.id === 'lab_app') S.app = true;
  Bus.emit('research', r.id);
}
function labWeek() {
  if (!S.lab) return;
  S.lab.left--;
  if (S.lab.left <= 0) {
    const r = RESEARCH_BY[S.lab.id];
    const opt = S.lab.opt;
    S.lab = null;
    completeResearch(r, opt);
    const extra = r.id === 'lab_signature' ? ` Your ${GENRE[opt].name} records now get a quality boost.` : r.id === 'lab_festival' ? ' The first festival happens this summer.' : r.id === 'lab_app' ? ' It will bring in money every month.' : '';

function goalReward(i) { return 4 + i * 2; }

function officeFrac(level) {

  const parts = [clamp(S.cash / (o.need * infl()), 0, 1)];

// Marks finished goals; the reward is a little Inspiration. Silent on load, so old saves don't get a flood.
function checkGoals(silent) {

    if (S.goals[g.id]) return;
    const [v, n] = g.prog();
    if (v < n) return;
    S.goals[g.id] = S.week;

// ---------- trends & timeline ----------
function trendsWeek() {
  S.trends = S.trends.filter((t) => t.until > S.week);
  const hasRandomG = S.trends.some((t) => t.g && t.random);
  if (!hasRandomG && rng.chance(1 / 60)) {
    const y = curYear();
    const g = rng.weighted(availableGenres(y), (gg) => genrePop(gg.id, y));
    if (!trendFor(g.id)) {
      S.trends.push({ g: g.id, until: S.week + rng.int(30, 60), random: true });
      notify({ kind: 'news', icon: 'trend', title: `${g.name} is trending`, text: `Fans can't get enough ${g.name} right now. ${g.name} records sell better while the trend lasts.` });
    }
  }
  const hasTheme = S.trends.some((t) => t.th);
  if (!hasTheme && rng.chance(1 / 55)) {
    const pool = THEMES.filter((t) => t.pack !== 'modern' || curYear() >= 1995);
    const th = rng.pick(pool);
    S.trends.push({ th: th.id, until: S.week + rng.int(20, 40) });
    notify({ kind: 'news', icon: 'trend', title: `Songs about ${th.name.toLowerCase()} are hot`, text: `Listeners are craving songs about ${th.name.toLowerCase()}. Records with that theme sell better for a while.` });
  }
}
function timelineWeek() {
  for (let i = 0; i < TIMELINE.length; i++) {
    if (S.timelineDone.includes(i)) continue;
    const ev = TIMELINE[i];
    if (S.week < weekOfDate(ev.y, ev.m)) continue;
    S.timelineDone.push(i);
    if (ev.genre && !S.genresOn.includes(ev.genre)) S.genresOn.push(ev.genre);
    if (ev.format && !S.formatsOn.includes(ev.format)) S.formatsOn.push(ev.format);
    if (ev.trend) S.trends.push({ g: ev.trend.g, until: S.week + ev.trend.weeks });
    if (ev.tourPause) S.tourPauseUntil = S.week + ev.tourPause;
    notify({ kind: 'news', icon: 'news', title: ev.title, text: ev.text, pause: !!(ev.genre || ev.format) });
  }
  // safety: anything whose date passed must be unlocked (e.g. after loading an old save)
  for (const g of GENRES) if (g.from <= curYear() && !S.genresOn.includes(g.id) && g.from === START_YEAR) S.genresOn.push(g.id);
}

// ---------- monthly & yearly ----------
function catalogEra(y) {
  if (y < 1983) return 0.8;
  if (y < 1999) return 1.2;
  if (y < 2009) return 0.7;
  return 1.0 + 2 * formatShare('stream', y) / formatTotal(y);
}
function monthly() {
  const y = curYear();
  spend('rent', Math.round(officeDef().rent * infl()));
  const sal = S.staff.reduce((s, w) => s + w.salary, 0);
  if (sal) spend('salaries', sal);
  if (S.loan) {
    spend('loan', S.loan.pay);
    S.loan.left--;
    if (S.loan.left <= 0) { S.loan = null; toast('Bank loan paid off', 'success', 'cash'); }
  }
  // catalog sales from records that are no longer in stores
  let cat = 0;
  const era = catalogEra(curYearF());
  for (const r of S.releases) {
    if (r.active) continue;
    const units = r.U * 0.0009 * Math.pow(Math.max(1, r.score) / 10, 1.5) * era * rng.range(0.8, 1.2);
    cat += units * PTYPES[r.type].price * 0.7 * infl();
    r.sold += Math.round(units);
  }
  if (cat > 0) earn('catalog', cat);
  if (hasR('b_merch')) earn('merch', S.artists.reduce((s, a) => s + a.fans, 0) * 0.005 * infl());
  if (hasR('b_publishing')) earn('publishing', S.releases.reduce((s, r) => s + r.sold, 0) * 0.0006 * infl());
  if (S.app) earn('app', (S.fans * 0.012 + S.releases.length * 1500) * infl());
  // fan club: every fan chips in a little each month (newsletters, member cards, mail-order)
  if (S.fans > 0) earn('fanclub', effFans(S.fans, 20e6) * 0.012 * (S.fanclub ? 2 : 1) * infl());
  if (S.debts && S.debts.length) {
    for (const d of S.debts) { spend('loan', d.pay); d.left--; }
    const done = S.debts.filter((d) => d.left <= 0);
    S.debts = S.debts.filter((d) => d.left > 0);
    for (const d of done) toast(`${d.name || 'Debt'} paid off`, 'success', 'cash');
  }
  // fans drift
  S.fans = Math.round(S.fans * 0.997);
  for (const a of S.artists) {
    if (S.week - a.lastRelease > WPY) a.fans = Math.round(a.fans * 0.994);
    a.mood = clamp(a.mood + (a.mood < 62 ? 1 : a.mood > 72 ? -1 : 0), 0, 100);
  }
  // the critics' bar relaxes slowly after a peak, but never below the industry standard
  S.topQ = Math.max(eraStandard(curYearF()), S.topQ * 0.99);
  S.hist.push({ w: S.week, cash: Math.round(S.cash), fans: S.fans });
  if (S.hist.length > 900) S.hist.shift();
  // festival in July
  if (S.festival && dateOf(S.week).month === 6) festival();
  contractChecks();
  // money trouble
  if (S.cash < 0) {
    S.redMonths++;
    if (S.redMonths === 1 && !S.loan) {
      const data = { amount: Math.round(Math.max(50000, -S.cash * 1.5 + 30000) * infl() / 1000) * 1000 };
      const m = EVENTS.loan.make(data);
      notify({ kind: 'event', icon: 'cash', title: m.title, text: m.text, ev: 'loan', data, pause: true });
    } else if (S.redMonths >= 3) {

// Labels start out at the local scene's awards and work their way up to the Golden Needles.
const AWARD_SHOWS = [
  { id: 'local', name: 'Riverside Scene Awards', sub: 'The local scene\'s big night at the Roxy Theatre', minScore: 6.8, fans: 0.015, insp: 5, star: 3, prize: 2500,
    cats: { record: 'Best Local Release', live: 'Best Live Act', newbie: 'Best New Local Act', label: 'Local Label of the Year' } },
  { id: 'indie', name: 'Silver Spool Awards', sub: 'Honoring the best of independent music', minScore: 7.5, fans: 0.02, insp: 10, star: 5, prize: 15000,
    cats: { record: 'Indie Record of the Year', album: 'Indie Album of the Year', newbie: 'Breakthrough Artist', label: 'Independent Label of the Year' } },
  { id: 'needle', name: 'Golden Needle Awards', sub: 'The music industry\'s biggest night', minScore: 8.2, fans: 0.03, insp: 15, star: 8, prize: 0,
    cats: { record: 'Record of the Year', album: 'Album of the Year', newbie: 'Best New Artist', label: 'Label of the Year' } },
];
const AWARD_SHOW = Object.fromEntries(AWARD_SHOWS.map((x) => [x.id, x]));
function awardShowFor() {
  if (S.office >= 3 || (S.fans >= 2e6 && S.stats.top10 >= 1)) return AWARD_SHOWS[2];
  if (S.office >= 2 || S.fans >= 120000) return AWARD_SHOWS[1];
  return AWARD_SHOWS[0];
}
function rivalNominee(gid, type) {
  const g = gid && GENRE[gid] ? gid : rng.pick(S.genresOn);
  const artist = artistNameFor(g, artistKindFor(g));
  if (type === 'act') return { title: artist, artist, label: rng.pick(RIVAL_LABELS) };
  if (type === 'label') { const l = rng.pick(RIVAL_LABELS); return { title: l, artist: l, label: '' }; }
  return { title: genTitle(rng.pick(S.themesOn), g, type === 'album' ? 'album' : 'single'), artist, label: rng.pick(RIVAL_LABELS) };
}
function awards(year) {
  if (year < START_YEAR) return;
  const rels = S.releases.filter((r) => dateOf(r.week).year === year && r.type !== 'hits');
  if (!rels.length) return;
  const show = awardShowFor();
  const push = S.awardPush === year ? 0.12 : 0;
  const results = [];
  const nominees = (ours, gid, type) => {
    const list = [];
    for (let k = 0; k < 12 && list.length < 3; k++) {
      const x = rivalNominee(gid, type);
      if (x.title === ours.title || list.some((y) => y.title === x.title || y.artist === x.artist)) continue;
      list.push(x);
    }
    const i = rng.int(0, 3);
    list.splice(i, 0, Object.assign({ ours: true }, ours));
    return list;
  };
  const add = (cat, best, p, type) => {
    const win = rng.chance(clamp(p + push, 0.06, 0.92));
    const noms = nominees({ title: best.title, artist: best.artist, label: type === 'label' ? '' : S.label }, best.genre, type);
    const winner = win ? noms.findIndex((x) => x.ours) : noms.findIndex((x) => !x.ours);
    results.push({ cat, title: best.title, artist: best.artist, artistId: best.artistId || null, relId: best.relId || null, win, nominees: noms, winner });
  };
  const nominateRecord = (cat, pool, type) => {
    const best = maxBy(pool, (r) => r.score + (r.peak ? (100 - r.peak) / 100 : 0));
    if (!best || best.score < show.minScore) return;
    if (show.id === 'needle' && !(best.peak && best.peak <= 40)) return;
    const p = (best.score - (show.minScore - 0.5)) / 2.2 + (best.peak && best.peak <= 5 ? 0.12 : 0);
    add(cat, { title: best.title, artist: best.artistName, artistId: best.artistId, relId: best.id, genre: best.genre }, p, type);
  };
  if (show.cats.album) {
    nominateRecord(show.cats.record, rels.filter((r) => r.type === 'single' || r.type === 'ep'), 'single');
    nominateRecord(show.cats.album, rels.filter((r) => r.type === 'album' || r.type === 'concept'), 'album');
  } else nominateRecord(show.cats.record, rels, 'single');
  if (show.cats.live) {
    const a = maxBy(S.artists.filter((x) => x.fans >= 1500 && rels.some((r) => r.artistId === x.id)), (x) => x.fans);
    if (a) add(show.cats.live, { title: a.name, artist: a.name, artistId: a.id, genre: a.genre }, 0.25 + Math.min(0.4, Math.log10(a.fans) / 15), 'act');
  }
  const newPeak = show.id === 'needle' ? 20 : show.id === 'indie' ? 40 : 101;
  const newbies = S.artists.filter((a) => S.week - a.signed < WPY * 2.2 && rels.some((r) => r.artistId === a.id && r.score >= show.minScore - 0.6 && (newPeak > 100 || (r.peak && r.peak <= newPeak))));
  if (newbies.length) { const a = maxBy(newbies, (x) => x.fans); add(show.cats.newbie, { title: a.name, artist: a.name, artistId: a.id, genre: a.genre }, 0.42, 'act'); }
  const strong = show.id === 'needle' ? rels.filter((r) => r.peak && r.peak <= 10).length : show.id === 'indie' ? rels.filter((r) => r.peak && r.peak <= 40).length : rels.filter((r) => r.score >= 7).length;
  if (strong >= 2) add(show.cats.label, { title: S.label, artist: S.label }, 0.2 + strong * 0.1, 'label');
  if (!results.length) return;
  for (const r of results) {
    if (!r.win) continue;
    S.stats.awards++;
    if (show.id === 'needle') { S.stats.needles = (S.stats.needles || 0) + 1; unlock('award'); }
  }
  S.awards.push({ year, show: show.id, results });
  notify({ kind: 'awards', icon: 'trophy', title: `The ${year + 1} ${show.name}`, text: `${S.label} has ${results.length} nomination${results.length > 1 ? 's' : ''} tonight.`, data: { year, show: show.id, results }, pause: true });
}
// Prizes are handed out when the envelope is opened, so the ceremony can show what each win brought.
function awardRewards(show, r) {
  if (!r.win || r.paid) return;
  r.paid = true;
  S.insp += show.insp;
  boostLabelFans(show.fans);
  if (show.prize) earn('other', Math.round(show.prize * infl() / 100) * 100);
  const a = r.artistId ? S.artists.find((x) => x.id === r.artistId) : null;
  if (a) { a.star = Math.min(100, a.star + show.star); boostArtistFans(a, show.fans * 1.6); a.awardHype = (a.awardHype || 0) + show.star * 3; a.mood = clamp(a.mood + 10, 0, 100); }
}

// ---------- knowledge that outlives a save ----------
// Genres, themes and formats work the same in every game, so what one label learns, the next one knows.
function mergeKnow(into, from) {
  if (!into || !from) return 0;
  let added = 0;
  into.combo = into.combo || {}; into.area = into.area || {}; into.ratio = into.ratio || {}; into.fmt = into.fmt || {};
  for (const k in from.combo || {}) if (into.combo[k] == null && from.combo[k] != null) { into.combo[k] = from.combo[k]; added++; }
  for (const g in from.area || {}) {
    const src = from.area[g] || [];
    const dst = into.area[g] || (into.area[g] = Array(9).fill(false));
    for (let i = 0; i < 9; i++) if (src[i] && !dst[i]) { dst[i] = true; added++; }
  }
  for (const g in from.ratio || {}) if (from.ratio[g] && !into.ratio[g]) { into.ratio[g] = true; added++; }
  for (const k in from.fmt || {}) if (into.fmt[k] == null && from.fmt[k] != null) { into.fmt[k] = from.fmt[k]; added++; }
  return added;
}
function knowCount(k) {
  if (!k) return 0;
  let n = Object.keys(k.combo || {}).length + Object.keys(k.fmt || {}).length + Object.values(k.ratio || {}).filter(Boolean).length;
  for (const g in k.area || {}) n += (k.area[g] || []).filter(Boolean).length;
  return n;
}

// ---------- save / load ----------
function serialize() {
  S.rngState = rng.s;
  return JSON.stringify(S);
}
function migrate(s) {
  const d = newGameState({ seed: s.seed || 1 });
  const hadGoals = !!s.goals;
  if (s.stats && s.stats.needles === undefined) s.stats.needles = s.stats.awards || 0; // every award before tiers was a Golden Needle
  for (const n of s.notes || []) if (n.kind === 'awards' && n.data && n.data.results && !n.data.show) { n.data.show = 'needle'; for (const r of n.data.results) r.paid = true; } // old ceremonies paid out up front
  for (const k in d) if (s[k] === undefined) s[k] = d[k];
  for (const k in d.stats) if (s.stats[k] === undefined) s.stats[k] = d.stats[k];
  if (!s.later) s.later = [];
  if (!s.cands || typeof s.cands !== 'object') s.cands = { hire: null, scout: null };
  if (!s.contractFix) { s.contractOffers = null; s.contractFix = 1; } // offers from older versions could be impossible to finish
  if (!hadGoals) s.goals = null; // older save: filled silently on load by checkGoals
  if (s.candidates) { if (!s.cands[s.candidates.kind]) s.cands[s.candidates.kind] = s.candidates; }
  delete s.candidates;
  const people = [s.you, ...(s.staff || []), ...(s.artists || []), ...(s.alumni || [])];
  for (const k of ['hire', 'scout']) if (s.cands && s.cands[k]) people.push(...s.cands[k].list);
  for (const x of people) { if (!x) continue; remapLook(x.look); (x.members || []).forEach(remapLook); }
  s.v = SAVE_VERSION;
  return s;
}
function loadState(obj) {
  S = migrate(obj);
  rng = new RNG(S.rngState || S.seed || 1);
  if (!S.goals) { S.goals = {}; checkGoals(true); }
  Tx.acc = {};
  Tx.bubbles = [];
  initCharts();
  Bus.emit('loaded');
}
function startNewGame(opts) {
  S = newGameState(opts);
  S.later = [];
  const a = opts.artist;
  a.signed = 0;
  a.status = 'idle';
  S.artists.push(a);
  S.usedNames.push(a.name);
  initCharts();
  S.hist.push({ w: 0, cash: S.cash, fans: 0 });
  Bus.emit('loaded');
  tip('welcome');
}

// Snapshots of the numbers a decision can change, so the outcome can show what moved.
function statSnap() {
  const p = S.project;
  const art = {};
  for (const a of S.artists) art[a.id] = { n: a.name, mood: a.mood, energy: a.energy, fans: a.fans, star: a.star, royalty: a.royalty };
  return { cash: S.cash, fans: S.fans, insp: S.insp, hype: currentHype(), pid: p ? p.id : null, F: p ? p.F : 0, C: p ? p.C : 0, T: p ? p.T : 0, art, staff: S.staff.map((w) => w.id), staffN: S.staff.reduce((o, w) => { o[w.id] = w.name; return o; }, {}), wEnergy: workers().reduce((s, w) => s + w.energy, 0) / Math.max(1, workers().length) };
}
function snapChips(a, b) {
  const out = [];
  const add = (t, d, fmt, upGood = true, eps = 0.5) => { if (!(Math.abs(d) >= eps)) return; out.push({ t, v: (d > 0 ? '+' : '−') + fmt(Math.abs(d)), good: upGood ? d > 0 : d < 0 }); };
  add('Cash', b.cash - a.cash, fmtMoney, true, 1);
  add('Fans', b.fans - a.fans, (x) => fmtNum(x), true, 1);
  add('Inspiration', b.insp - a.insp, (x) => fmtInt(Math.round(x)));
  add('Hype', b.hype - a.hype, (x) => fmtInt(Math.round(x)));
  if (a.pid && a.pid === b.pid) {
    add('Flaws', b.F - a.F, (x) => fmtInt(Math.round(x)) || '1', false);
    add('Creativity', b.C - a.C, (x) => fmtInt(Math.round(x)));
    add('Sound', b.T - a.T, (x) => fmtInt(Math.round(x)));
  }
  add('Team energy', b.wEnergy - a.wEnergy, (x) => fmtInt(Math.round(x)), true, 1);
  for (const id in a.art) {
    const x = a.art[id], y = b.art[id];
    if (!y) { out.push({ t: x.n, v: 'left the label', good: false }); continue; }
    add(`${x.n} mood`, y.mood - x.mood, (v) => fmtInt(Math.round(v)), true, 1);
    add(`${x.n} energy`, y.energy - x.energy, (v) => fmtInt(Math.round(v)), true, 1);
    add(`${x.n} fans`, y.fans - x.fans, (v) => fmtNum(v), true, 1);
    add(`${x.n} star power`, y.star - x.star, (v) => fmtInt(Math.round(v)), true, 1);
    add(`${x.n} royalty`, (y.royalty - x.royalty) * 100, (v) => v.toFixed(0) + ' pts', false, 0.5);
  }
  for (const id of a.staff) if (!b.staff.includes(id)) out.push({ t: a.staffN[id], v: 'left the team', good: false });
  return out;
}
// A consequence happens right away and is reported center-screen (or quietly, if minor).
function consequence(o) {
  const before = statSnap();
  const extra = o.apply ? o.apply() : null;
  const chips = snapChips(before, statSnap());
  const good = o.good != null ? o.good : chips.length ? chips.filter((c) => c.good).length >= chips.length / 2 : true;
  return notify({ kind: 'result', icon: o.icon || (good ? 'check' : 'spark'), cat: o.cat || (good ? 'chance' : 'trouble'), title: o.title, text: o.text + (extra ? ' ' + extra : ''), chips, good, pause: !o.minor });
}
