const LEDGER_NAMES = { fanclub: 'Fan club', sales: 'Record sales', catalog: 'Catalog', tours: 'Tours & shows', contracts: 'Contract work', merch: 'Merchandise', publishing: 'Publishing', app: 'Streaming app', other: 'Other', royalties: 'Artist royalties', recording: 'Recording', marketing: 'Marketing', salaries: 'Salaries', rent: 'Rent & bills', research: 'Research', signing: 'Signing advances', licenses: 'Format licenses', training: 'Training', hiring: 'Hiring', scouting: 'Scouting', office: 'Moving', legal: 'Legal', loan: 'Loan payments' };
function openFinances() {
  const y = curYear();
  const L = S.ledger[y] || { inc: {}, exp: {} }, P = S.ledger[y - 1] || { inc: {}, exp: {} };
  const tot = (o) => Object.values(o).reduce((a, b) => a + b, 0);
  const m = UI.modal({ title: 'Finances', sub: `${S.label} · ${fmtDate(S.week)}`, cls: 'wide' });
  const hist = S.hist.slice(-120);
  let svg = '';
  if (hist.length > 1) {
    const W = 640, H = 160, pad = 4;
    const vals = hist.map((h) => h.cash);
    const mn = Math.min(0, ...vals), mx = Math.max(1, ...vals);
    const xs = (i) => pad + (i / (hist.length - 1)) * (W - pad * 2);
    const ys = (v) => H - pad - ((v - mn) / (mx - mn || 1)) * (H - pad * 2);
    const line = vals.map((v, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join('');
    const area = line + `L${xs(vals.length - 1).toFixed(1)},${ys(mn).toFixed(1)}L${xs(0).toFixed(1)},${ys(mn).toFixed(1)}Z`;
    svg = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cash over the last ${hist.length} months">
      <line x1="0" x2="${W}" y1="${ys(0).toFixed(1)}" y2="${ys(0).toFixed(1)}" stroke="#E2DCEF" stroke-width="1.5"/>
      <path d="${area}" fill="rgba(47,191,113,0.14)"/><path d="${line}" fill="none" stroke="#1E9A57" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="${xs(vals.length - 1).toFixed(1)}" cy="${ys(vals[vals.length - 1]).toFixed(1)}" r="4.5" fill="#1E9A57"/>
    </svg><div class="row small muted" style="justify-content:space-between;font-weight:800;margin-top:4px"><span>${esc(fmtDate(hist[0].w))}</span><span>Peak ${esc(fmtMoney(mx))}</span><span>${esc(fmtDate(hist[hist.length - 1].w))}</span></div>`;
  }
  const rows = (o) => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(LEDGER_NAMES[k] || k)}</td><td class="num" style="text-align:right">${fmtMoney(v)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Nothing yet</td></tr>';
  const monthly = officeDef().rent * infl() + S.staff.reduce((s, w) => s + w.salary, 0) + (S.loan ? S.loan.pay : 0);
  m.body.innerHTML = `
    <div class="kv">
      <div><b class="num" style="color:${S.cash < 0 ? 'var(--flaw)' : 'var(--ink)'}">${fmtMoney(S.cash)}</b><span>Cash</span></div>
      <div><b class="num" style="color:var(--good-dk)">${fmtMoney(tot(L.inc))}</b><span>Income in ${y}</span></div>
      <div><b class="num" style="color:var(--label-dk)">${fmtMoney(tot(L.exp))}</b><span>Spending in ${y}</span></div>
      <div><b class="num">${fmtMoney(monthly)}</b><span>Fixed costs / month</span></div>
    </div>
    ${svg ? `<div><div class="sec-title">Cash over time</div>${svg}</div>` : ''}
    <div class="grid2">
      <div><div class="sec-title">Income in ${y}</div><table class="table"><tbody>${rows(L.inc)}</tbody></table></div>
      <div><div class="sec-title">Spending in ${y}</div><table class="table"><tbody>${rows(L.exp)}</tbody></table></div>
    </div>
    ${tot(P.inc) ? `<p class="small muted" style="font-weight:700">Last year: ${fmtMoney(tot(P.inc))} in, ${fmtMoney(tot(P.exp))} out, ${tot(P.inc) - tot(P.exp) >= 0 ? 'profit' : 'loss'} of ${fmtMoney(Math.abs(tot(P.inc) - tot(P.exp)))}.</p>` : ''}
    ${S.loan ? `<p class="small" style="font-weight:800">Bank loan: ${fmtMoney(S.loan.pay)} a month for ${S.loan.left} more months.</p>` : ''}
    ${(S.debts || []).map((d) => `<p class="small" style="font-weight:800">${esc(d.name || 'Debt')}: ${fmtMoney(d.pay)} a month for ${d.left} more months.</p>`).join('')}
    <div class="card fanmoney"><div class="sec-title" style="margin:0">${icon('fans')} What your fans are worth</div>
      <div class="small">Your ${fmtNum(S.fans)} fans pay about <b>${fmtMoney(effFans(S.fans, 20e6) * 0.012 * (S.fanclub ? 2 : 1) * infl())}</b> a month through the fan club${S.fanclub ? ' (doubled by your official fan club)' : ''}, and buy about <b>${fmtNum(effFans(S.fans, 20e6) * 0.05)}</b> copies of each new record (more when the reviews are good), on top of what the artist's own fans buy. More fans also means more hype at launch.</div></div>`;
  m.foot.innerHTML = `<button class="btn" data-a="close">Close</button>`;
  m.foot.addEventListener('click', () => m.close());
}

  if (show === 'local') return `<svg viewBox="0 0 80 90" class="trophy" aria-hidden="true"><rect x="12" y="10" width="56" height="70" rx="6" fill="#8A5A3B"/><rect x="16" y="14" width="48" height="62" rx="4" fill="#A86F48"/><circle cx="40" cy="40" r="17" fill="#1F1B2B"/><circle cx="40" cy="40" r="12" fill="none" stroke="#3A3446" stroke-width="1.2"/><circle cx="40" cy="40" r="6" fill="#E2A72C"/><rect x="22" y="62" width="36" height="8" rx="2" fill="#E2C27A"/></svg>`;
  if (show === 'indie') return `<svg viewBox="0 0 80 90" class="trophy" aria-hidden="true"><rect x="22" y="72" width="36" height="12" rx="3" fill="#3A3446"/><rect x="34" y="56" width="12" height="18" fill="#B9C2D3"/><circle cx="40" cy="34" r="26" fill="#D9DFEA"/><circle cx="40" cy="34" r="20" fill="#B9C2D3"/><circle cx="40" cy="34" r="7" fill="#EEF1F7"/>${[0, 1, 2].map((i) => `<circle cx="${40 + 13 * Math.cos(i * 2.094 - 1.57)}" cy="${34 + 13 * Math.sin(i * 2.094 - 1.57)}" r="4.5" fill="#8F99AD"/>`).join('')}</svg>`;
  return `<svg viewBox="0 0 80 90" class="trophy" aria-hidden="true"><rect x="20" y="74" width="40" height="11" rx="3" fill="#3A3446"/><rect x="24" y="64" width="32" height="11" rx="2" fill="#B8862A"/><path d="M38 64 L36 40 L44 40 L42 64 Z" fill="#E2A72C"/><path d="M40 42 C36 30 30 20 14 10 C26 8 40 10 52 20 C56 24 56 32 46 40 Z" fill="#F0C14B"/><path d="M16 11 C28 10 42 13 52 21" fill="none" stroke="#B8862A" stroke-width="2"/><circle cx="62" cy="58" r="3" fill="#E2A72C"/><path d="M44 48 L62 58" stroke="#E2A72C" stroke-width="2.4"/></svg>`;
}
function openAwards(n) {
  const data = n.data || (S.awards[S.awards.length - 1] || {});
  const results = data.results || [];
  const show = AWARD_SHOW[data.show] || AWARD_SHOW.needle;
  const m = UI.modal({ title: null, cls: 'ceremony', closable: false, backdropClose: false, onClose: () => { if (UI.card === m) { UI.card = null; setTimeout(() => UI.renderNotes(), 0); } } });
  m.kind = 'awards';
  m.noteId = n.id;
  m.body.innerHTML = `
    <div class="cer-stage s-${show.id}"><div class="beam b1"></div><div class="beam b2"></div>${trophySVG(show.id)}
      <div class="cer-title"><small>${esc(fmtDate(S.week))}</small><h2>${esc(show.name)}</h2><span>${esc(show.sub)}</span></div></div>
    <div class="cer-status" id="cer-status">${esc(S.label)} is up for ${results.length} award${results.length === 1 ? '' : 's'} tonight.</div>
    <div class="cer-cats">${results.map((r, i) => `<div class="cer-cat" data-i="${i}"><div class="cer-cname">${esc(r.cat)}</div>
      <div class="cer-noms">${(r.nominees || [{ title: r.title, artist: r.artist, ours: true }]).map((x, j) => `<div class="cer-nom ${x.ours ? 'ours' : ''}" data-j="${j}"><b>${esc(x.title)}</b><span>${x.title !== x.artist ? esc(x.artist) + ' · ' : ''}${esc(x.label || '')}</span></div>`).join('')}</div>
      <div class="cer-res" data-res="${i}"></div></div>`).join('')}</div>
    <div class="cer-sum" id="cer-sum" hidden></div>`;
  m.foot.innerHTML = `<button class="btn ghost sm" data-a="skip">Skip ahead</button><span style="flex:1"></span><button class="btn primary" data-a="ok" disabled>Back to work</button>`;
  let fast = false, wake = null;
  const wait = (ms) => new Promise((res) => { if (fast) { setTimeout(res, 30); return; } const id = setTimeout(res, ms); wake = () => { clearTimeout(id); res(); }; });
  const status = m.body.querySelector('#cer-status');
  const run = async () => {
    AudioEngine.applause(2.2, false);
    await wait(1400);
    for (let i = 0; i < results.length; i++) {
      if (!m.el.isConnected) return;
      const r = results[i];
      const cat = m.body.querySelector(`.cer-cat[data-i="${i}"]`);
      cat.classList.add('on');
      cat.scrollIntoView({ block: 'nearest', behavior: fast ? 'auto' : 'smooth' });
      status.textContent = `The nominees for ${r.cat} are…`;
      await wait(1300);
      status.textContent = 'And the winner is…';
      if (!fast) AudioEngine.roll(1.5, true);
      await wait(1600);
      if (!m.el.isConnected) return;
      const noms = cat.querySelectorAll('.cer-nom');
      const wi = r.winner != null && r.winner >= 0 ? r.winner : -1;
      noms.forEach((el, j) => el.classList.add(j === wi ? 'win' : 'lose'));
      const res = cat.querySelector('.cer-res');
      if (r.win) {
        res.innerHTML = `${icon('trophy')} You won!`;
        cat.classList.add('won');
        status.textContent = `${r.title} wins ${r.cat}!`;
        AudioEngine.sfx('fanfare'); AudioEngine.applause(3.4, true); AudioEngine.cheer();
        UI.confetti(140);
      } else {
        const w = r.nominees && wi >= 0 ? r.nominees[wi] : null;
        res.textContent = w ? `${w.title} (${w.label}) took it` : 'Not this year';
        status.textContent = 'Not this time.';
        AudioEngine.applause(1.6, false);
      }
      await wait(2200);
    }
    if (!m.el.isConnected) return;
    const wins = results.filter((r) => r.win).length;
    m.outcome = true;
    const out = resolveNote(n.id, -1) || { chips: [] };
    const sum = m.body.querySelector('#cer-sum');
    sum.hidden = false;
    sum.innerHTML = `<b>${wins ? `${wins} win${wins > 1 ? 's' : ''} for ${esc(S.label)}!` : 'No wins this year.'}</b><span>${wins ? 'Winning brings fans, star power and inspiration' + (show.prize ? ', plus prize money' : '') + '.' : show.id === 'needle' ? 'Keep making great records. The voters will notice.' : 'A nomination is still a good night out.'}</span>${out.chips && out.chips.length ? `<div class="chips">${chipsHTML(out.chips)}</div>` : ''}${show.id !== 'needle' ? `<span class="cer-next">${show.id === 'local' ? 'Grow to an indie label (a Downtown Studio or 120K fans) to compete at the Silver Spool Awards.' : 'Become a major player (Label HQ, or 2M fans and a Top 10 hit) to compete at the Golden Needles.'}</span>` : ''}`;
    status.textContent = 'That\'s a wrap.';
    const skip = m.foot.querySelector('[data-a=skip]'); if (skip) skip.remove();
    m.foot.querySelector('[data-a=ok]').disabled = false;
    m.foot.querySelector('[data-a=ok]').focus({ preventScroll: true });
  };
  run();
  m.foot.addEventListener('click', (e) => {
    if (e.target.closest('[data-a=skip]')) { fast = true; if (wake) wake(); return; }
    if (e.target.closest('[data-a=ok]') && !e.target.closest('[disabled]')) { m.close(); UI.card = null; UI.renderNotes(); }
  });
  return m;
}

// ============================================================
// Main: boot, title, new game, saves, loop, input, settings
// ============================================================
const WEEK_SEC = 2.4;
const SLOTS = [{ id: 'auto', name: 'Autosave' }, { id: '1', name: 'Slot 1' }, { id: '2', name: 'Slot 2' }, { id: '3', name: 'Slot 3' }];

// ---------- storage ----------
// What you've learned about genres, themes and formats, kept across every save on this account.
const Lore = {
  data: null, timer: null,
  blank() { return { v: 1, combo: {}, area: {}, ratio: {}, fmt: {} }; },
  loadLocal() {
    if (this.data) return this.data;
    try { this.data = JSON.parse(Store.localGet('rlt.lore') || 'null'); } catch (e) { this.data = null; }
    if (!this.data || typeof this.data !== 'object') this.data = this.blank();
    return this.data;
  },
  async loadCloud() {
    await Store.initCloud();
    if (!Store.cloudReady) return 0;
    try {
      const snap = await Store.db.doc(`data/users/${Store.uid}/lore`).get();
      if (snap.exists) { const rec = Store.unpack(snap.data()); if (rec) return mergeKnow(this.loadLocal(), rec); }
    } catch (e) { /* offline: the local copy is enough */ }
    return 0;
  },
  // pull the current game's discoveries in, push everything we know into the game
  sync(quietly) {
    if (!S || S.loreOff) return 0;
    const L = this.loadLocal();
    const learned = mergeKnow(L, S.know);
    const gained = mergeKnow(S.know, L);
    if (learned) this.persist();
    if (gained && !quietly) toast(`Your past labels taught you ${gained} thing${gained === 1 ? '' : 's'} about genres and themes`, 'info', 'bulb');
    return gained;
  },
  persist() {
    clearTimeout(this.timer);
    this.timer = setTimeout(async () => {
      const json = JSON.stringify(this.data);
      Store.localSet('rlt.lore', json);
      await Store.initCloud();
      if (Store.cloudReady) { try { await Store.db.doc(`data/users/${Store.uid}/lore`).set(Object.assign({ v: 1, savedAt: Date.now() }, Store.pack(json))); } catch (e) { /* try again next time */ } }
    }, 800);
  },
  reset() { this.data = this.blank(); this.persist(); },
};

const Store = {
  db: null, uid: null, dl: null, cloudReady: false, cloudPromise: null, writing: {}, queued: {},
  localGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  localSet(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  localDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  initCloud() {
    if (this.cloudPromise) return this.cloudPromise;
    this.cloudPromise = (async () => {
      try {
        if (!window.claude || typeof window.claude.use !== 'function') return false;
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (!db || !user) return false;
        const id = await user.id();
        if (!id) return false;
        this.db = db; this.uid = id; this.cloudReady = true;
        return true;
      } catch (e) { return false; }
    })();
    return this.cloudPromise;
  },
  async downloads() {
    if (this.dl !== null) return this.dl;
    try { this.dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { this.dl = null; }
    return this.dl;
  },
  pack(json) {
    const L = window.LZString;
    if (L && L.compressToBase64) return { z: 'lz64', d: L.compressToBase64(json) };
    return { z: 'raw', d: json };
  },
  unpack(rec) {
    if (!rec || !rec.d) return null;
    if (rec.z === 'lz64') {
      const L = window.LZString;
      if (!L) throw new Error('Compression library did not load');
      return JSON.parse(L.decompressFromBase64(rec.d));
    }
    return JSON.parse(rec.d);
  },
  meta() {
    const d = dateOf(S.week);
    return { label: S.label, date: `${MONTHS[d.month]} ${d.year}`, cash: S.cash, office: S.office, releases: S.releases.length, savedAt: Date.now(), seed: S.seed };
  },
  async save(slot, quiet) {
    if (!S) return false;
    const rec = Object.assign({ v: SAVE_VERSION }, this.meta(), this.pack(serialize()));
    const okLocal = this.localSet('rlt.save.' + slot, JSON.stringify(rec));
    let okCloud = false;
    await this.initCloud();
    if (this.cloudReady) {
      if (this.writing[slot]) { this.queued[slot] = rec; okCloud = true; }
      else okCloud = await this.writeCloud(slot, rec);
    }
    if (!quiet) toast(okCloud || okLocal ? `Saved to ${SLOTS.find((s) => s.id === slot).name}${okCloud ? '' : ' (this browser only)'}` : 'Could not save. Try exporting a save file instead.', okCloud || okLocal ? 'success' : 'warn', 'save');
    return okCloud || okLocal;
  },
  async writeCloud(slot, rec) {
    this.writing[slot] = true;
    let ok = false;
    try {
      await this.db.doc(`data/users/${this.uid}/save-${slot}`).set(rec);
      ok = true;
    } catch (e) {
      if (e && e.code === 'unavailable') { try { await new Promise((r) => setTimeout(r, 600 + Math.random() * 800)); await this.db.doc(`data/users/${this.uid}/save-${slot}`).set(rec); ok = true; } catch (e2) { ok = false; } }
    }
    this.writing[slot] = false;
    if (this.queued[slot]) { const q = this.queued[slot]; this.queued[slot] = null; return this.writeCloud(slot, q); }
    return ok;
  },
  async list() {
    const out = {};
    for (const s of SLOTS) {
      const raw = this.localGet('rlt.save.' + s.id);
      if (raw) { try { const rec = JSON.parse(raw); out[s.id] = { slot: s.id, rec, source: 'This browser' }; } catch (e) { /* ignore */ } }
    }
    await this.initCloud();
    if (this.cloudReady) {
      await Promise.all(SLOTS.map(async (s) => {
        try {
          const snap = await this.db.doc(`data/users/${this.uid}/save-${s.id}`).get();
          if (snap.exists) {
            const rec = snap.data();
            if (!out[s.id] || (rec.savedAt || 0) >= (out[s.id].rec.savedAt || 0)) out[s.id] = { slot: s.id, rec, source: 'Your account' };
          }
        } catch (e) { /* ignore */ }
      }));
    }
    return SLOTS.map((s) => out[s.id]).filter(Boolean);
  },
  prefs() { try { return JSON.parse(this.localGet('rlt.prefs') || '{}'); } catch (e) { return {}; } },
  savePrefs(p) { this.localSet('rlt.prefs', JSON.stringify(p)); },
};

    document.addEventListener('visibilitychange', () => {

    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ state: S && this.mode === 'play' ? serialize() : null })); } catch (e) { /* ignore */ }
    Lore.loadLocal();
    Lore.loadCloud().then((n) => { if (n && S && this.mode === 'play') Lore.sync(false); });
    if (data && data.state) {
      try { loadState(JSON.parse(data.state)); this.enterPlay(); } catch (e) { this.showTitle(); }
    } else this.showTitle();
    requestAnimationFrame((t) => { this.last = t; this.loop(t); });
  },
  bindInput() {
    const cv = document.getElementById('stage');
    cv.addEventListener('click', (e) => {
      if (this.mode !== 'play' || !S) return;
      AudioEngine.ensure();
      const hit = Office.hitTest(e.clientX, e.clientY);
      if (hit) {
        AudioEngine.sfx('click');
        if (hit.kind === 'worker') return openStaffMember(hit.id);
        if (hit.kind === 'artist' || hit.kind === 'member') return openArtist(hit.a ? hit.a.id : hit.id);
        if (hit.kind === 'cat') { toast(rng.pick(['Purrr.', 'The cat ignores you.', 'Mrrp?', 'The cat approves of this record.']), 'info', 'cat'); return; }
        if (hit.kind === 'npc') { toast('Reception: "Your 2 o\'clock is here!"', 'info', 'users'); return; }
      }
      UI.openMenu(e.clientX + 6, e.clientY + 6);
    });
    cv.addEventListener('contextmenu', (e) => { e.preventDefault(); if (this.mode === 'play') UI.openMenu(e.clientX + 6, e.clientY + 6); });
  },
  layoutPads() {
    const hud = Math.max(56, UI.hudHeight());
    const tall = window.innerHeight >= 720 && window.innerWidth >= 700;
    Office.topPad = hud + (tall ? 104 : 8);
    Office.rightPad = window.innerWidth >= 1280 ? 230 : 0;
    const dock = document.getElementById('dock');
    Office.bottomPad = dock && !dock.hidden ? Math.round(dock.getBoundingClientRect().height * 0.55) + 10 : 14;
    Office.fit();
    if (S && UI.els.goal) UI.renderGoal(true);
  },
  isPaused() { return this.userPaused || UI.modals.length > 0 || !!UI.menuEl || !S || shouldHalt(); },
  setSpeed(sp) {
    if (!S) return;
    if (sp === 0) { this.userPaused = true; }
    else { S.speed = sp; this.userPaused = false; this.pausedByHide = false; }
    AudioEngine.ensure();
  },
  toggleSound() {
    AudioEngine.ensure();
    const on = !(AudioEngine.musicOn || AudioEngine.sfxOn);
    AudioEngine.setMusic(on); AudioEngine.setSfx(on);
    this.savePrefs();
    this.musicKey = '';
  },
  savePrefs() { Store.savePrefs({ musicOn: AudioEngine.musicOn, sfxOn: AudioEngine.sfxOn, musicVol: AudioEngine.musicVol, sfxVol: AudioEngine.sfxVol }); },
  onModalChange() {},
  loop(ts) {
    const dt = Math.min(0.1, Math.max(0, (ts - this.last) / 1000));
    this.last = ts;
    try {
      if (this.mode === 'play' && S) {
        if (!this.isPaused()) advance(dt * S.speed / WEEK_SEC);
        if (S.project && S.project.awaiting === 'sliders' && !UI.modals.some((m) => m.kind === 'stage') && !S.notes.some((n) => n.pause)) openStageDialog();
        if (S.gameOver && !this.gameOverShown) { this.gameOverShown = true; UI.closeAll(); openGameOver(); }
        this.musicTimer -= dt;
        if (this.musicTimer <= 0) { this.musicTimer = 0.5; this.syncMusic(); }
        if (this.autosaveSoon && !UI.modals.length) { this.autosaveSoon = false; this.autosave(true); }
      }
      const f0 = performance.now();
      Office.frame(dt);
      if (!document.hidden) Office.notePerf(performance.now() - f0);
      UI.update(ts);
    } catch (err) {
      console.error(err);
      if (!this.errShown) { this.errShown = true; toast('Something went wrong. Your game is autosaved; try reloading.', 'warn'); }
    }
    requestAnimationFrame((t) => this.loop(t));
  },
  desiredMusic() {
    if (!S || !AudioEngine.musicOn) return null;
    const p = S.project;
    if (p) {
      if (p.awaiting && p.stage === 0) return null;
      const layer = Math.min(3, p.stage + (p.awaiting ? 0 : 1));
      return { key: 'p:' + p.seed + ':' + layer, song: () => buildSong(p.genre, songIndexOf(p), p.theme), layer };
    }
    if (S.contract) { const h = Math.abs(hashStr(S.contract.id)); return { key: 'k:' + S.contract.id, song: () => buildSong(['pop', 'country', 'jazz', 'rnb', 'electronic'][h % 5], h % SONGS_PER_GENRE), layer: 2 }; }
    const last = S.releases[S.releases.length - 1];
    if (last) return { key: 'r:' + last.id, song: () => buildSong(last.genre, songIndexOf(last), last.theme), layer: 3, radio: true };
    return { key: 'jam', song: () => buildSong(S.artists[0] ? S.artists[0].genre : 'rnb', Math.abs(hashStr(S.label)) % SONGS_PER_GENRE), layer: 1, radio: true };
  },
  syncMusic() {
    if (this.listening || UI.modals.some((m) => m.kind === 'reviews')) return;
    const d = this.desiredMusic();
    const key = d ? d.key : '';
    if (key === this.musicKey && (d ? AudioEngine.playing : !AudioEngine.playing)) return;
    if (!AudioEngine.ctx) { if (d) this.musicKey = ''; return; }
    this.musicKey = key;
    if (!d) { AudioEngine.stop(); return; }
    const song = d.song();
    if (AudioEngine.playing && AudioEngine.song && AudioEngine.song.seed === song.seed && AudioEngine.song.genre === song.genre) { AudioEngine.setLayer(d.layer); AudioEngine.radio = !!d.radio; return; }
    AudioEngine.play(song, { layer: d.layer, radio: d.radio });
  },
  autosave(force) {
    if (this.mode !== 'play' || !S || S.gameOver) return;
    const now = performance.now();
    if (!force && now - this.lastAutosave < 45000) return;
    this.lastAutosave = now;
    Store.save('auto', true);
  },
  // ---------- screens ----------
  showTitle() {
    this.mode = 'title';
    S = null;
    UI.closeAll();
    UI.els.hud.hidden = true;
    UI.els.proj.hidden = true;
    if (UI.els.dock) UI.els.dock.hidden = true;
    if (UI.els.goal) UI.els.goal.hidden = true;
    Office.bottomPad = 14;
    UI.els.sales.innerHTML = '';
    UI.els.notes.innerHTML = '';
    Office.topPad = 24;
    Office.setLevel(1);
    Office.fit();
    AudioEngine.stop();
    this.musicKey = '';
    const t = UI.els.title;
    t.hidden = false;
    t.innerHTML = `<div class="title-inner">
      <h1 class="sr">Record Label Tycoon</h1>
      <div class="bigdisc" aria-hidden="true"><div class="lab"><div class="logo"><span>Record Label</span><span>Tycoon</span></div></div></div>
      <p class="lead">Start a record label in a garage in 1975. Sign artists, cut hits, ride fifty years of music history and build an empire.</p>
      <div class="btns" id="t-btns"><button class="btn primary lg" data-a="new">${icon('disc')} New game</button></div>
      <div class="foot" id="t-foot">Checking for saved games…</div>
    </div>`;
    t.querySelector('[data-a=new]').addEventListener('click', () => { AudioEngine.ensure(); AudioEngine.sfx('click'); openNewGame(); });
    Store.list().then((saves) => {
      if (this.mode !== 'title') return;
      const btns = t.querySelector('#t-btns');
      const foot = t.querySelector('#t-foot');
      if (!btns) return;
      if (saves.length) {
        const latest = saves.slice().sort((a, b) => (b.rec.savedAt || 0) - (a.rec.savedAt || 0))[0];
        btns.insertAdjacentHTML('afterbegin', `<button class="btn gold lg" data-a="cont">${icon('play')} Continue</button>`);
        btns.insertAdjacentHTML('beforeend', `<button class="btn lg" data-a="load">${icon('save')} Load</button>`);
        btns.querySelector('[data-a=cont]').addEventListener('click', () => this.loadSlot(latest));
        btns.querySelector('[data-a=load]').addEventListener('click', () => openLoad());
        foot.textContent = `Last played: ${latest.rec.label} · ${latest.rec.date} · ${latest.source.toLowerCase()}`;
      } else foot.textContent = Store.cloudReady ? 'Your saves sync to your account.' : 'Saves are kept in this browser.';
    }).catch(() => { const f = t.querySelector('#t-foot'); if (f) f.textContent = ''; });
  },
  toTitle(openLoadAfter) {
    if (S && this.mode === 'play' && !S.gameOver) Store.save('auto', true);
    this.showTitle();
    if (openLoadAfter) setTimeout(() => openLoad(), 100);
  },
  loadSlot(entry) {
    try {
      const st = Store.unpack(entry.rec);
      if (!st) throw new Error('empty');
      AudioEngine.ensure();
      loadState(st);
      this.enterPlay();
      toast(`Welcome back to ${S.label}`, 'success', 'disc');
    } catch (e) {
      console.error(e);
      toast('That save could not be loaded.', 'warn');
    }
  },
  enterPlay() {
    this.mode = 'play';
    this.userPaused = false;
    this.gameOverShown = false;
    UI.closeAll();
    UI.els.title.hidden = true;
    UI.els.title.innerHTML = '';
    UI.buildHUD();
    UI.buildDock();
    Office.setLevel(S.office);
    Main.layoutPads();
    Office.inflight = { c: 0, t: 0, f: 0, i: 0 };
    Office.bubbles = [];
    UI.renderNotes();
    UI.renderProject(true);
    this.musicKey = '';
    this.lastAutosave = performance.now();
    Lore.sync(false);
  },
};

    if (st.step === 1) {
      m.el.querySelector('.modal-head h2').textContent = 'Start your label';
      m.body.innerHTML = `
        <div class="grid2">
          <div style="display:grid;gap:16px;align-content:start">
            <div><div class="sec-title">Label name</div><div class="field"><input class="input" id="ng-label" maxlength="32" aria-label="Label name"><button class="btn" data-a="dice" aria-label="Suggest a name">${icon('dice')}</button></div></div>
            <div><div class="sec-title">Your name</div><input class="input" id="ng-name" maxlength="24" placeholder="Your name" aria-label="Your name" style="width:100%"></div>
            <p class="small" style="font-weight:700;color:var(--ink-2)">You produce every record yourself at first. Later you can hire a whole team.</p>
          </div>
          <div><div class="sec-title">Your look</div>
            <div class="lookgrid">
              <img id="ng-face" class="avatar lg" alt="Your character" style="width:110px;height:110px">
              <div style="display:grid;gap:10px">
                <div><div class="meta">Skin</div><div class="swatches">${SKINS.map((c) => `<button class="sw ${st.look.skin === c ? 'sel' : ''}" style="background:${c}" data-skin="${c}" aria-label="Skin tone"></button>`).join('')}</div></div>
                <div><div class="meta">Hair</div><div class="wrap">${HAIRS.map((h) => `<button class="chip ${st.look.hair === h ? 'sel' : ''}" style="--c:var(--ink);padding:3px 9px" data-hair="${h}">${HAIR_NAMES[h] || h}</button>`).join('')}</div></div>
                <div><div class="meta">Hair color</div><div class="swatches">${HAIR_COLORS.concat(DYED.slice(0, 3)).map((c) => `<button class="sw ${st.look.hairColor === c ? 'sel' : ''}" style="background:${c}" data-hc="${c}" aria-label="Hair color"></button>`).join('')}</div></div>
                <div><div class="meta">Shirt</div><div class="swatches">${SHIRTS.slice(0, 10).map((c) => `<button class="sw ${st.look.shirt === c ? 'sel' : ''}" style="background:${c}" data-sh="${c}" aria-label="Shirt color"></button>`).join('')}</div></div>
                <div class="wrap"><button class="chip ${st.look.acc === 'glasses' ? 'sel' : ''}" style="--c:var(--ink)" data-acc="glasses">Glasses</button><button class="chip ${st.look.acc === 'headphones' ? 'sel' : ''}" style="--c:var(--ink)" data-acc="headphones">Headphones</button><button class="chip ${st.look.acc === 'cap' ? 'sel' : ''}" style="--c:var(--ink)" data-acc="cap">Cap</button><button class="chip ${st.look.beard ? 'sel' : ''}" style="--c:var(--ink)" data-beard="1">Beard</button><button class="btn sm" data-a="rlook">${icon('dice')} Random</button></div>
              </div>
            </div>
          </div>
        </div>`;
      m.body.querySelector('#ng-label').value = st.label;
      m.body.querySelector('#ng-name').value = st.name;
      m.body.querySelector('#ng-label').addEventListener('input', (e) => { st.label = e.target.value; });
      m.body.querySelector('#ng-name').addEventListener('input', (e) => { st.name = e.target.value; });
      m.body.querySelector('#ng-face').src = personPortrait(st.look, 110, '#FFE0E0');
      m.foot.innerHTML = `<button class="btn" data-a="back">Back</button><button class="btn primary lg" data-a="next">Next: sign an artist</button>`;
    } else {
      m.el.querySelector('.modal-head h2').textContent = 'Sign your first artist';
      m.body.innerHTML = `
        <p style="font-weight:700;color:var(--ink-2)">Every great label starts with one artist who believes in it. These three local acts want to record with ${esc(st.label || 'you')}. They'll join for a share of the royalties.</p>
        <div class="rgrid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${cands.map((a) => artistCardHTML(a, { sel: st.artist === a.id, click: true, attr: `data-art="${a.id}"`, showStatus: false, noEnergy: true, traitDesc: true, footer: `<div class="meta">${esc(GENRE[a.genre].desc)} · ${a.contract} records · ${fmtPct(a.royalty)} royalty</div>` })).join('')}</div>`;
      m.foot.innerHTML = `<button class="btn" data-a="prev">Back</button><button class="btn primary lg" data-a="go" ${st.artist ? '' : 'disabled'}>${icon('disc')} Open the doors</button>`;

  render();
  m.el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a],[data-skin],[data-hair],[data-hc],[data-sh],[data-acc],[data-beard],[data-art]');
    if (!b) return;

    if (d.a === 'dice') { st.label = genLabelName(new RNG(Math.random() * 1e9)); m.body.querySelector('#ng-label').value = st.label; return; }
    if (d.a === 'back') { m.close(); return; }
    if (d.a === 'next') { if (!st.label.trim()) { st.label = genLabelName(r); } st.step = 2; render(); return; }
    if (d.a === 'prev') { st.step = 1; render(); return; }

      if (!st.artist) return;
      const a = cands.find((x) => x.id === st.artist);

      AudioEngine.sfx('fanfare');
      Office.celebrate(80);
      Store.save('auto', true);
      return;
    }
    if (d.a === 'rlook') { st.look = genLook(new RNG(Math.random() * 1e9)); render(); return; }
    if (d.skin) st.look.skin = d.skin;
    if (d.hair) st.look.hair = d.hair;
    if (d.hc) st.look.hairColor = d.hc;
    if (d.sh) st.look.shirt = d.sh;
    if (d.acc) st.look.acc = st.look.acc === d.acc ? 'none' : d.acc;
    if (d.beard) st.look.beard = !st.look.beard;
    if (d.art) { st.artist = d.art; AudioEngine.sfx('click'); }
    const keepLabel = m.body.querySelector('#ng-label');
    if (keepLabel) st.label = keepLabel.value;
    const keepName = m.body.querySelector('#ng-name');
    if (keepName) st.name = keepName.value;
    render();
  });
}

// ---------- load & settings ----------
function openLoad() {
  const m = UI.modal({ title: 'Load game', sub: 'Pick a save to continue', cls: 'narrow' });
  m.body.innerHTML = '<div class="empty">Looking for saves…</div>';
  m.foot.innerHTML = `<label class="btn" style="cursor:pointer">${icon('save')} Import a save file<input type="file" accept=".json,application/json" id="imp" hidden></label><button class="btn" data-a="close">Close</button>`;
  m.foot.querySelector('[data-a=close]').addEventListener('click', () => m.close());
  m.foot.querySelector('#imp').addEventListener('change', (e) => importSave(e.target.files[0], m));
  Store.list().then((saves) => {
    if (!m.el.isConnected) return;
    m.body.innerHTML = saves.length ? `<div class="list">${saves.map((s) => `<div class="card"><div class="row"><div class="grow"><b>${esc(SLOTS.find((x) => x.id === s.slot).name)}: ${esc(s.rec.label)}</b><div class="meta">${esc(s.rec.date)} · ${fmtMoney(s.rec.cash)} · ${s.rec.releases} records · ${esc(s.source)}</div><div class="meta">Saved ${new Date(s.rec.savedAt).toLocaleString()}</div></div><button class="btn primary sm" data-slot="${s.slot}">Load</button></div></div>`).join('')}</div>` : '<div class="empty">No saved games yet.</div>';
    m.body.querySelectorAll('[data-slot]').forEach((b) => b.addEventListener('click', () => { const s = saves.find((x) => x.slot === b.dataset.slot); m.close(); Main.loadSlot(s); }));
  });
}
function importSave(file, m) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const st = obj.rlt && obj.state ? obj.state : obj;
      if (!st || !st.label || st.week == null) throw new Error('not a save');
      if (m) m.close();
      AudioEngine.ensure();
      loadState(st);
      Main.enterPlay();
      toast(`Imported ${S.label}`, 'success', 'save');
    } catch (e) { toast('That file is not a Record Label Tycoon save.', 'warn'); }
  };
  fr.readAsText(file);
}
async function exportSave() {
  const dl = await Store.downloads();
  const data = JSON.stringify({ rlt: SAVE_VERSION, exported: new Date().toISOString(), state: JSON.parse(serialize()) });
  if (!dl) { toast('Downloads are not available here.', 'warn'); return; }
  try {
    await dl.save({ filename: `${S.label.replace(/[^a-z0-9]+/gi, '-').toLowerCase()}-${curYear()}.json`, data });
    toast('Save file exported', 'success', 'save');
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast('The export did not go through.', 'warn');
  }
}

  render();
  m.foot.innerHTML = `<button class="btn ghost" data-a="title">Quit to title</button><span style="flex:1"></span><button class="btn primary" data-a="close">Done</button>`;

  });
  m.body.addEventListener('input', (e) => {
    const r = e.target.closest('input[type=range]');
